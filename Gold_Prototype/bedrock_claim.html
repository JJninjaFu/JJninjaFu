<title>Bedrock Claim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen isometric claim; a weathered assay-office HUD floats on top (ledger strip, controls, command bar, side drawer). */
:root {
  --bg: #15130f;
  --panel: rgba(27, 23, 17, 0.93);
  --panel-solid: #1d1913;
  --line: #3b3226;
  --ink: #efe5cf;
  --muted: #a99b80;
  --gold: #e3b448;
  --water: #6fb1d6;
  --danger: #d4574a;
  --ok: #8db36a;
  --display: "Rye", "Georgia", serif;
  --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
button, select { font-family: var(--ui); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); }
button { background: #2a241b; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; min-height: 36px; }
button:hover { border-color: #5a4c38; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.on { background: var(--gold); color: #241a05; border-color: var(--gold); }
button.dim { opacity: 0.5; }
button.warn { border-color: #6b3a33; color: #f0b8ad; }
button.goldbtn { background: #4a3812; border-color: var(--gold); color: #ffe3a0; }

.topbar { position: absolute; top: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.ledger { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 7px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ledger h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.1; color: var(--gold); letter-spacing: 0.02em; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--gold); font-weight: 700; }
.stats .neg { color: var(--danger); }
.perf { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.seg { display: inline-flex; gap: 2px; }
.seg button { border-radius: 4px; padding: 7px 9px; }

.cmdbar { position: absolute; bottom: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: flex-end; pointer-events: none; }
.cmdbar > * { pointer-events: auto; }
.selpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 680px; }
.selinfo { font-size: 15px; line-height: 1.25; }
.selinfo b { color: var(--gold); font-weight: 700; }
.selinfo .st { color: var(--muted); font-size: 13px; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; }

#toast { position: absolute; left: 50%; transform: translateX(-50%); top: 92px; background: var(--panel-solid); border: 1px solid var(--gold); color: var(--ink); border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); font-size: 15px; z-index: 5; }
#toast button { min-height: 30px; padding: 4px 10px; }

#drawer { position: absolute; top: 76px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 96px; width: 370px; max-width: calc(100% - 24px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 8px; }
.dhead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--gold); }
.dbody { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.dbody h3 { margin: 4px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.dbody p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.shopitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
.shopitem .nm { font-weight: 700; font-size: 16px; }
.shopitem .ds { grid-column: 1 / 2; color: var(--muted); font-size: 13px; line-height: 1.3; }
.shopitem button { grid-row: 1 / 3; grid-column: 2; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.slider label { font-size: 14px; }
.slider output { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 600; font-size: 14px; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
.slider.changed label::after { content: " · changed"; color: var(--gold); }
.copybox { width: 100%; min-height: 90px; background: #12100c; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 6px; }
table.rep { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.rep td { padding: 5px 4px; border-bottom: 1px solid #2c261d; }
table.rep td.n { text-align: right; color: var(--gold); font-weight: 600; }
.board { display: flex; flex-direction: column; gap: 1px; font-size: 14px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; }
.board .me { color: var(--gold); font-weight: 700; }
.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.field input, .field select { background: #12100c; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; color: var(--ink); min-height: 36px; font-family: var(--ui); font-size: 16px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; margin: 0; }
.keys dt { color: var(--gold); font-weight: 600; }
.keys dd { margin: 0; }

@media (max-width: 640px) {
  .ledger h1 { font-size: 17px; }
  .stats { font-size: 13px; gap: 0 10px; }
  #drawer { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; bottom: 8px; height: 62%; }
  #toast { top: auto; bottom: 150px; }
}
</style>

<div id="app">
  <canvas id="gl" aria-label="Mining claim"></canvas>
  <canvas id="hud"></canvas>

  <header class="topbar">
    <div class="ledger">
      <h1>Bedrock Claim</h1>
      <div class="stats" id="stats"></div>
      <div class="perf" id="perf">measuring…</div>
      <div class="board" id="board" hidden></div>
    </div>
    <div class="controls">
      <div class="seg" id="speedSeg" role="group" aria-label="Game speed">
        <button data-speed="0">Pause</button>
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
      <button data-drawer="race">Race</button>
      <button data-drawer="shop">Shop</button>
      <button data-drawer="crew">Crew</button>
      <button id="surveyBtn">Survey</button>
      <button data-drawer="tune">Tune</button>
      <button id="sndBtn" aria-pressed="true">Tap for sound</button>
      <button data-drawer="help">Controls</button>
    </div>
  </header>

  <div id="toast" hidden><span id="toastText"></span><button id="toastCancel">Cancel</button></div>

  <footer class="cmdbar">
    <div class="selpanel">
      <div class="selinfo" id="selInfo"></div>
      <div class="cmds" id="cmds"></div>
    </div>
  </footer>

  <aside id="drawer" hidden>
    <div class="dhead"><h2 id="drawerTitle">Shop</h2><button id="drawerClose">Close</button></div>
    <div class="dbody" id="drawerBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// =============================================================== tuning
const DEFAULT_T = {
  digRate: 0.8, bucket: 1.6, siteRadius: 3.5, loaderCap: 1.6, washRate: 0.14, hopperCap: 20, recovery: 0.85, cutoff: 0.6,
  wage: 0.9, fuelExc: 0.35, fuelLoader: 0.15, fuelGen: 0.4, fuelPump: 0.12, repose: 0.75, goldPrice: 115, seasonMin: 20,

const T_FIELDS = [
  ['digRate', 'Excavator digging, m³ per second', 0.05, 2, 0.05], ['bucket', 'Excavator bucket, m³', 0.3, 4, 0.1], ['siteRadius', 'Dig site radius, m', 2, 10, 0.5],
  ['loaderCap', 'Loader bucket, m³', 0.5, 6, 0.1], ['washRate', 'Wash plant, m³ per second', 0.02, 1, 0.01], ['hopperCap', 'Wash plant hopper, m³', 4, 80, 1],
  ['recovery', 'Gold recovery at the plant', 0.3, 1, 0.01], ['cutoff', 'Pay dirt cutoff, g per m³', 0, 4, 0.1],
  ['wage', 'Wage per worker, $ per second', 0, 5, 0.1], ['fuelExc', 'Excavator diesel, $ per second', 0, 3, 0.05], ['fuelLoader', 'Loader diesel, $ per second', 0, 3, 0.05],
  ['fuelGen', 'Generator diesel, $ per second', 0, 3, 0.05], ['fuelPump', 'Pump diesel, $ per second', 0, 2, 0.02], ['repose', 'Pile steepness (angle of repose)', 0.3, 1.5, 0.05],
  ['goldPrice', 'Starting gold price, $ per gram', 20, 400, 5], ['seasonMin', 'Season length, minutes', 5, 90, 1],

const T = Object.assign({}, DEFAULT_T);
const STORE_KEY = 'bedrockClaim.tune.v1';
try { Object.assign(T, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) { /* storage unavailable */ }
function saveTune() { try { localStorage.setItem(STORE_KEY, JSON.stringify(T)); } catch (e) { /* ignore */ } }
const PRICES = { excavator: 14000, loader: 6000, pump: 2500, generator: 8000, plant: 18000, bunkhouse: 5000, survey: 1500, hire: 600 };

// =============================================================== ground: surface, overburden, pay gravel, bedrock
const SIZE = 200, N = 161, CELL = SIZE / (N - 1), HALF = SIZE / 2, NN = N * N, WATER_Y = -1.4;
const H = new Float32Array(NN), H0 = new Float32Array(NN), PAYTOP = new Float32Array(NN), BEDR = new Float32Array(NN), GRADE = new Float32Array(NN);
const loose = new Float32Array(NN), looseKind = new Uint8Array(NN);
const I = (i, j) => j * N + i;
const gx = x => (x + HALF) / CELL;
const wx = i => i * CELL - HALF;
function hAt(x, z) {
  const fx = clamp(gx(x), 0, N - 1.0001), fz = clamp(gx(z), 0, N - 1.0001);
  const i = fx | 0, j = fz | 0, u = fx - i, v = fz - j;
  return lerp(lerp(H[I(i, j)], H[I(i + 1, j)], u), lerp(H[I(i, j + 1)], H[I(i + 1, j + 1)], u), v);
}
let seed = 20261030;
function srand() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const hash = (i, j) => { const s = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return s - Math.floor(s); };
const creekZ = x => 70 + 8 * Math.sin(x * 0.03);
const channelZ = x => -10 + 22 * Math.sin(x * 0.022 + 0.6);
const POCKETS = [];
for (let n = 0; n < 7; n++) POCKETS.push([srand() * 160 - 80, srand() * 120 - 85, 2.5 + srand() * 3, 5 + srand() * 8]);
function genGround() {
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = wx(i), z = wx(j), k = I(i, j);
    let h = 1.2 * Math.sin(x * 0.025) * Math.cos(z * 0.02) + 0.6 * Math.sin(x * 0.06 + 1) * Math.sin(z * 0.05) - z * 0.012 + 0.6;
    h += 6 * Math.exp(-((x + 55) ** 2 + (z + 45) ** 2) / (2 * 16 * 16));
    const cd = Math.abs(z - creekZ(x));
    h = lerp(h, -2.6, smooth(8, 3.5, cd));
    H[k] = H0[k] = h;
    const over = 1.4 + 0.9 * (0.5 + 0.5 * Math.sin(x * 0.07 + z * 0.05)) + Math.max(0, h) * 0.22;
    const pay = 1.6 + 0.8 * (0.5 + 0.5 * Math.cos(x * 0.05 - z * 0.06));
    PAYTOP[k] = h - (cd < 6 ? 0.4 : over);
    BEDR[k] = PAYTOP[k] - pay;
    const dp = Math.abs(z - channelZ(x));
    let g = (0.15 + 4.0 * Math.exp(-(dp * dp) / (2 * 9 * 9))) * (0.65 + 0.7 * hash(i, j));
    for (const [px, pz, pr, pg] of POCKETS) g += pg * Math.exp(-((x - px) ** 2 + (z - pz) ** 2) / (2 * pr * pr));
    GRADE[k] = g;
  }
}
genGround();

// =============================================================== three.js
const glCanvas = $('#gl'), hud = $('#hud'), hctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8b3a1);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -600, 1200);
scene.add(new THREE.HemisphereLight(0xf2ead8, 0x4d4130, 0.8));
const sunL = new THREE.DirectionalLight(0xfff0d0, 0.85); sunL.position.set(-60, 120, -40); scene.add(sunL);

const tGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(NN * 3), tCol = new Float32Array(NN * 3), tNrm = new Float32Array(NN * 3), tIdx = new Uint32Array((N - 1) * (N - 1) * 6);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = I(i, j); tPos[k * 3] = wx(i); tPos[k * 3 + 1] = H[k]; tPos[k * 3 + 2] = wx(j); }
{ let p = 0; for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { const a = I(i, j), b = I(i, j + 1), c = I(i + 1, j), d = I(i + 1, j + 1); tIdx[p++] = a; tIdx[p++] = b; tIdx[p++] = c; tIdx[p++] = c; tIdx[p++] = b; tIdx[p++] = d; } }
tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
tGeo.setAttribute('normal', new THREE.BufferAttribute(tNrm, 3));
tGeo.setIndex(new THREE.BufferAttribute(tIdx, 1));
const terrain = new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
scene.add(terrain);
const water = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), new THREE.MeshLambertMaterial({ color: 0x3f6f8a, transparent: true, opacity: 0.78, depthWrite: false }));
water.rotation.x = -Math.PI / 2; water.position.y = WATER_Y; scene.add(water);
const base = new THREE.Mesh(new THREE.BoxGeometry(SIZE, 8, SIZE), new THREE.MeshLambertMaterial({ color: 0x5a4a36 }));
base.position.y = -8; scene.add(base);
let survey = false;
function normalAt(i, j) {
  const k = I(i, j);
  const nx = (H[I(Math.max(i - 1, 0), j)] - H[I(Math.min(i + 1, N - 1), j)]) / (2 * CELL);
  const nz = (H[I(i, Math.max(j - 1, 0))] - H[I(i, Math.min(j + 1, N - 1))]) / (2 * CELL);
  const L = Math.hypot(nx, 1, nz);
  tNrm[k * 3] = nx / L; tNrm[k * 3 + 1] = 1 / L; tNrm[k * 3 + 2] = nz / L;
}
function colorVertex(i, j) {
  const k = I(i, j), h = H[k], v = (hash(i, j) - 0.5) * 0.05;
  let c;
  if (loose[k] > 0.05) c = looseKind[k] === 2 ? [0.46, 0.29, 0.17] : looseKind[k] === 3 ? [0.63, 0.61, 0.55] : [0.56, 0.46, 0.33];
  else if (H0[k] < WATER_Y) c = [0.46, 0.43, 0.34];
  else if (h < H0[k] - 0.15) {
    if (h > PAYTOP[k] + 0.05) c = [0.43, 0.32, 0.21];
    else if (h > BEDR[k] + 0.05) { const sp = hash(i * 3, j * 7) > 0.85 ? 0.08 : 0; c = [0.62 + sp, 0.46 + sp, 0.27]; }
    else c = [0.33, 0.33, 0.37];
  } else {
    c = [0.44, 0.5, 0.26];
    const nb = (a, b) => Math.abs(H[I(clamp(a, 0, N - 1), clamp(b, 0, N - 1))] - h) / CELL;
    const st = smooth(0.6, 1.2, Math.max(nb(i + 1, j), nb(i - 1, j), nb(i, j + 1), nb(i, j - 1)));
    c = [lerp(c[0], 0.45, st), lerp(c[1], 0.36, st), lerp(c[2], 0.24, st)];
  }
  if (survey && loose[k] <= 0.05 && h > BEDR[k] + 0.05) {
    const t = clamp(GRADE[k] / 5, 0, 1);
    const heat = t < 0.5 ? [lerp(0.25, 0.85, t * 2), lerp(0.3, 0.7, t * 2), lerp(0.55, 0.15, t * 2)] : [lerp(0.85, 1, (t - 0.5) * 2), lerp(0.7, 0.85, (t - 0.5) * 2), lerp(0.15, 0.25, (t - 0.5) * 2)];
    c = [lerp(c[0], heat[0], 0.65), lerp(c[1], heat[1], 0.65), lerp(c[2], heat[2], 0.65)];
  }
  tCol[k * 3] = c[0] + v; tCol[k * 3 + 1] = c[1] + v; tCol[k * 3 + 2] = c[2] + v;
}
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { colorVertex(i, j); normalAt(i, j); }
tGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 160);
let dirty = null;
function markDirty(i0, j0, i1, j1) {
  if (!dirty) dirty = [i0, j0, i1, j1];
  else { dirty[0] = Math.min(dirty[0], i0); dirty[1] = Math.min(dirty[1], j0); dirty[2] = Math.max(dirty[2], i1); dirty[3] = Math.max(dirty[3], j1); }
}
function flushTerrain() {
  if (!dirty) return;
  const i0 = Math.max(0, dirty[0] - 1), j0 = Math.max(0, dirty[1] - 1), i1 = Math.min(N - 1, dirty[2] + 1), j1 = Math.min(N - 1, dirty[3] + 1);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { tPos[I(i, j) * 3 + 1] = H[I(i, j)]; colorVertex(i, j); normalAt(i, j); }
  tGeo.attributes.position.needsUpdate = true; tGeo.attributes.color.needsUpdate = true; tGeo.attributes.normal.needsUpdate = true;
  dirty = null;
}
function cellBox(x, z, r) {
  return [Math.max(1, Math.floor(gx(x - r))), Math.max(1, Math.floor(gx(z - r))), Math.min(N - 2, Math.ceil(gx(x + r))), Math.min(N - 2, Math.ceil(gx(z + r)))];
}

// --- moving earth: digging layer by layer, dumping, slumping piles
function overlap(a0, a1, b0, b1) { return Math.max(0, Math.min(a1, b1) - Math.max(a0, b0)); }
function digAt(cx, cz, r, want) {
  // Find the highest diggable spot inside the site and take a scoop around it, top down.
  const [i0, j0, i1, j1] = cellBox(cx, cz, r);
  let best = -1, bh = -1e9;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    if (dist(wx(i), wx(j), cx, cz) > r) continue;
    const k = I(i, j);
    if (H[k] - BEDR[k] > 0.03 && H[k] > bh) { bh = H[k]; best = k; }
  }
  if (best < 0) return null;
  const bx = wx(best % N), bz = wx((best / N) | 0);
  let vol = 0, gold = 0, payVol = 0;
  const [a0, b0, a1, b1] = cellBox(bx, bz, 1.8);
  const cellA = CELL * CELL;
  for (let pass = 0; pass < 6 && vol < want; pass++) {
    for (let j = b0; j <= b1 && vol < want; j++) for (let i = a0; i <= a1 && vol < want; i++) {
      const d = dist(wx(i), wx(j), bx, bz);
      if (d > 1.8 || dist(wx(i), wx(j), cx, cz) > r + 0.6) continue;
      const k = I(i, j);
      const dh = Math.min(H[k] - BEDR[k], 0.12 * (1 - d / 2.2), (want - vol) / cellA);
      if (dh <= 0.001) continue;

  if (now - SFX.voiceT > 0.1) { SFX.voiceT = now; SFX.voices = 0; }
  if (++SFX.voices > 8) return;
  let out;
  if (kind === 'click' || kind === 'cash') { out = SFX.ctx.createGain(); out.gain.value = kind === 'cash' ? 0.35 : 0.2; out.connect(SFX.master); }
  else { out = sndOut(x, z, 160); if (!out) return; }
  const t = now + 0.01;
  switch (kind) {
    case 'dig': noiseBurst(out, t, 0.7, 'bandpass', 900, 300, 1.2, 0.7, 0.6); noiseBurst(out, t + 0.15, 0.4, 'lowpass', 400, 150, 0.7, 0.5, 0.35); break;
    case 'dump': noiseBurst(out, t, 1.0, 'lowpass', 700, 120, 0.6, 0.9, 0.85); tone(out, t, 'sine', 70, 40, 0.3, 0.6); break;
    case 'ding': tone(out, t, 'sine', 1760, 1700, 0.5, 0.25); tone(out, t, 'sine', 2637, 2600, 0.35, 0.12); break;
    case 'cash': tone(out, t, 'square', 1046, 1046, 0.08, 0.2); tone(out, t + 0.08, 'square', 1568, 1568, 0.18, 0.2); noiseBurst(out, t + 0.05, 0.4, 'highpass', 5000, 0, 0.5, 0.25, 0.3); break;
    case 'click': tone(out, t, 'sine', 880, 660, 0.06, 0.5); break;
  }
}
function updateAmbience() {
  if (!SFX.ctx || !SFX.hum) return;
  const t = SFX.ctx.currentTime, on = SFX.on && timeScale > 0;
  let eng = 0;
  for (const m of machines) if (m.crewed && (m.moving || (m.order && m.order.k === 'dig'))) eng += Math.pow(clamp(1 - dist(m.x, m.z, cam.x, cam.z) / 120, 0, 1), 1.5);
  for (const s of structures) if (s.kind === 'generator' && s.on) eng += 0.5 * Math.pow(clamp(1 - dist(s.x, s.z, cam.x, cam.z) / 120, 0, 1), 1.5);
  let rat = 0;
  for (const s of structures) if (s.kind === 'plant' && s.running) rat = Math.max(rat, Math.pow(clamp(1 - dist(s.x, s.z, cam.x, cam.z) / 110, 0, 1), 1.5));
  const z = clamp(40 / cam.size, 0.35, 1.3);
  SFX.hum.g.gain.setTargetAtTime(on ? Math.min(0.22, eng * 0.09) * z : 0, t, 0.2);
  SFX.rattle.gain.setTargetAtTime(on ? rat * 0.07 * z : 0, t, 0.2);
}
$('#sndBtn').addEventListener('click', () => {
  const wasRunning = SFX.ctx && SFX.ctx.state === 'running';
  if (wasRunning || !SFX.on) SFX.on = !SFX.on;
  if (SFX.on) { audioInit(); setTimeout(() => { if (SFX.ctx) tone(SFX.master, SFX.ctx.currentTime + 0.01, 'sine', 880, 660, 0.12, 0.5); }, 60); }
  if (!SFX.on && silentEl) silentEl.pause();
  updateSoundLabel();
});
updateSoundLabel();

// =============================================================== multiplayer race (artifact room: live presence, nothing stored)
// Every player digs an identical claim (same seed) on their own device. Presence carries
// name, team, gold washed and the shared start time; anyone in the room can start a race.
const TEAMS = { solo: 'Free for all', gold: 'Team Gold', silver: 'Team Silver' };
const NICK_KEY = 'bedrockClaim.nick';
const mp = { lobby: null, checked: false, room: null, unsub: null, code: '', nick: 'Prospector', team: 'solo', minutes: 15, status: '', lastSent: '' };
try { mp.nick = localStorage.getItem(NICK_KEY) || mp.nick; } catch (e) { /* storage unavailable */ }
mp.code = Array.from({ length: 4 }, () => 'abcdefghjkmnpqrstuvwxyz'[Math.floor(Math.random() * 23)]).join('');
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('room').then(r => { mp.lobby = r; mp.checked = true; if (drawer === 'race') renderDrawer(); }, () => { mp.checked = true; if (drawer === 'race') renderDrawer(); });
} else mp.checked = true;
function myPhase() { return !race.active ? 'lobby' : Date.now() < race.startAt ? 'count' : ledger.over ? 'done' : 'race'; }
function pushPresence() {
  if (!mp.room) return;
  const pr = { nick: mp.nick, team: mp.team, gold: Math.round(ledger.goldWashed * 10) / 10, phase: myPhase(), startAt: race.active ? race.startAt : 0, minutes: race.active ? race.minutes : mp.minutes };
  const key = JSON.stringify(pr);
  if (key === mp.lastSent) return;
  mp.lastSent = key;
  mp.room.presence(pr).catch(() => { mp.lastSent = ''; });
}
function mpPlayers() {
  const mine = { nick: mp.nick, team: mp.team, gold: ledger.goldWashed, phase: myPhase(), me: true };
  if (!mp.room) return [mine];
  return mp.room.peers().filter(p => p.kind === 'viewer').map(p => {
    if (p.sameTab) return mine;
    const pr = p.presence || {}, g = Number(pr.gold);
    return { nick: String(pr.nick || 'Prospector').slice(0, 16), team: TEAMS[pr.team] ? pr.team : 'solo', gold: isFinite(g) ? Math.max(0, g) : 0, phase: String(pr.phase || 'lobby'), me: false };
  });
}
function standings() {
  const rows = mpPlayers().sort((a, b) => b.gold - a.gold), tbl = document.createElement('table');
  tbl.className = 'rep';
  rows.forEach((r, i) => {
    const tr = tbl.insertRow(), a = tr.insertCell(), b = tr.insertCell();
    a.textContent = `${i + 1}. ${r.nick}${r.me ? ' (you)' : ''}${r.team !== 'solo' ? ' · ' + TEAMS[r.team] : ''}${r.phase === 'race' || r.phase === 'count' ? ' · digging' : ''}`;
    b.className = 'n'; b.textContent = r.gold.toFixed(1) + ' g';
  });
  const tg = rows.filter(r => r.team === 'gold').reduce((a, r) => a + r.gold, 0), ts = rows.filter(r => r.team === 'silver').reduce((a, r) => a + r.gold, 0);
  if (rows.some(r => r.team !== 'solo')) {
    const tr = tbl.insertRow(), a = tr.insertCell(), b = tr.insertCell();
    a.textContent = `Team Gold ${tg.toFixed(1)} g vs Team Silver`; b.className = 'n'; b.textContent = ts.toFixed(1) + ' g';
  }
  return tbl;
}
function renderBoard() {
  const el = $('#board');
  if (!mp.room && !race.active) { el.hidden = true; return; }
  el.hidden = false; el.textContent = '';
  mpPlayers().sort((a, b) => b.gold - a.gold).slice(0, 4).forEach((r, i) => {
    const d = document.createElement('div');
    d.textContent = `${i + 1}. ${r.nick}${r.team !== 'solo' ? ' (' + (r.team === 'gold' ? 'G' : 'S') + ')' : ''}  ${r.gold.toFixed(1)} g`;
    if (r.me) d.className = 'me';
    el.append(d);
  });
}
function renderPeerList() {
  const el = $('#peerList');
  if (!el) return;
  el.textContent = '';
  el.append(standings());
  const n = mpPlayers().length, sb = $('#startBtn');
  if (sb) sb.disabled = n > 4;
  if (n > 4) { const w = document.createElement('p'); w.textContent = `${n} people are here. A race takes 4 at most; someone should pick another room code.`; el.append(w); }
}
function checkStart() {
  if (!mp.room || (race.active && !ledger.over)) return;
  for (const p of mp.room.peers()) {
    if (p.sameTab) continue;
    const pr = p.presence || {}, st = Number(pr.startAt) || 0;
    if (st && st !== race.startAt && st > Date.now() - 15000 && st < Date.now() + 60000 && (pr.phase === 'count' || pr.phase === 'race')) { beginRace(st, Number(pr.minutes)); return; }
  }
}
function onRoomChange() { checkStart(); renderPeerList(); renderBoard(); if (drawer === 'season' && race.active) renderDrawer(); }
async function joinRoom(code) {
  code = String(code).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
  if (!code) return toast('Type a room code first.', 2000);
  mp.code = code; mp.status = 'Joining…'; renderDrawer();
  try {
    const r = await mp.lobby.join('bc-' + code);
    mp.room = r; mp.status = ''; mp.lastSent = '';
    mp.unsub = r.onPeers(onRoomChange, () => { mp.room = null; mp.status = 'Lost the connection to the room. Join again.'; if (drawer === 'race') renderDrawer(); });
    pushPresence();
  } catch (e) { mp.status = 'Could not join the room (' + ((e && e.code) || 'error') + ').'; }
  renderDrawer();
}
function leaveRoom() {
  if (mp.unsub) mp.unsub();
  if (mp.room) mp.room.leave().catch(() => {});
  mp.room = null; mp.unsub = null;
  if (race.active) endRace(); else renderDrawer();
}
function resetClaim() {
  for (const m of machines) scene.remove(m.mesh);
  for (const s of structures) scene.remove(s.mesh);
  machines.length = 0; structures.length = 0; piles.length = 0;
  loose.fill(0); looseKind.fill(0); blocked.fill(0);
  genGround();
  Object.assign(ledger, { money: 25000, goldSafe: 0, goldWashed: 0, goldSold: 0, earned: 0, spent: 0, workers: 3, price: T.goldPrice, seasonT: 0, over: false, priceT: 0, priceN: 0 });
  sel = null; toolMode = null; hideToast(); surveyBought = false; survey = false;
  $('#surveyBtn').classList.remove('on'); $('#surveyBtn').textContent = 'Survey';
  setupClaim();
  for (const s of structures) if (s.kind === 'pump') s.wetOK = waterNear(s.x, s.z, 9) > 0;
  markDirtyAll();
}
function beginRace(startAt, minutes) {
  if (!race.active) race.savedT = Object.assign({}, T);
  race = { active: true, startAt, minutes: [10, 15, 20, 30].includes(minutes) ? minutes : 15, savedT: race.savedT };
  Object.assign(T, DEFAULT_T); T.seasonMin = race.minutes;
  resetClaim();
  setSpeed(1);
  drawer = null; renderDrawer(); renderBoard(); pushPresence();
  cam.x = -2; cam.z = 22;
}
function endRace() {
  if (race.savedT) Object.assign(T, race.savedT);
  race = { active: false, startAt: race.startAt };
  ledger.over = false; ledger.seasonT = 0;
  drawer = 'race'; renderDrawer(); pushPresence();
}
function renderRaceDrawer(body, p, h3) {
  $('#drawerTitle').textContent = 'Claim race';
  body.append(p('Up to 4 prospectors each work an identical claim at the same time. Most gold washed in one year wins. Pick a team for 2 v 2, or play free for all.'));
  if (!mp.lobby) { body.append(p(mp.checked ? 'Multiplayer works when this page is open on claude.ai and shared with your friends. It is not available in this view.' : 'Connecting…')); return; }
  const field = (label, el) => { const d = document.createElement('label'); d.className = 'field'; const s = document.createElement('span'); s.textContent = label; d.append(s, el); return d; };
  const nick = document.createElement('input'); nick.type = 'text'; nick.maxLength = 16; nick.value = mp.nick; nick.autocomplete = 'off';
  nick.addEventListener('change', () => { mp.nick = nick.value.trim().slice(0, 16) || 'Prospector'; try { localStorage.setItem(NICK_KEY, mp.nick); } catch (e) { /* ignore */ } pushPresence(); renderPeerList(); });
  const team = document.createElement('select');
  for (const k in TEAMS) { const o = document.createElement('option'); o.value = k; o.textContent = TEAMS[k]; team.append(o); }
  team.value = mp.team;
  team.addEventListener('change', () => { mp.team = team.value; pushPresence(); renderPeerList(); });
  body.append(field('Your name', nick), field('Team', team));
  if (!mp.room) {
    const code = document.createElement('input'); code.type = 'text'; code.maxLength = 8; code.value = mp.code; code.autocomplete = 'off'; code.autocapitalize = 'none';
    body.append(h3('Room'), p('Everyone types the same room code.'), field('Room code', code),
      (() => { const r = document.createElement('div'); r.className = 'row'; r.append(btn('Join room', () => joinRoom(code.value))); return r; })());
    if (mp.status) body.append(p(mp.status));
    return;
  }
  body.append(h3('Room ' + mp.code));
  const list = document.createElement('div'); list.id = 'peerList'; body.append(list);
  if (race.active) {
    body.append(p(ledger.over ? 'Your year is over.' : 'Race in progress. Tuning and speed are locked.'),
      (() => { const r = document.createElement('div'); r.className = 'row'; r.append(btn('Leave the race', endRace, 'warn')); return r; })());
  } else {
    const mins = document.createElement('select');
    for (const m of [10, 15, 20, 30]) { const o = document.createElement('option'); o.value = m; o.textContent = `${m} minutes`; mins.append(o); }
    mins.value = String(mp.minutes);
    mins.addEventListener('change', () => { mp.minutes = +mins.value; pushPresence(); });
    const start = btn('Start the race for everyone', () => beginRace(Date.now() + 6000, mp.minutes), 'goldbtn'); start.id = 'startBtn';
    body.append(field('One year lasts', mins), p('Starting wipes your current claim. Everyone in the room starts on a fresh claim at the same moment.'),
      (() => { const r = document.createElement('div'); r.className = 'row'; r.append(start, btn('Leave room', leaveRoom)); return r; })());
  }
  renderPeerList();
}

// =============================================================== loop
function syncMeshes(dt) {
  for (const m of machines) {
    m.mesh.position.set(m.x, m.y, m.z);
    const tilt = Math.atan2(hAt(m.x + Math.sin(m.heading) * 2, m.z + Math.cos(m.heading) * 2) - hAt(m.x - Math.sin(m.heading) * 2, m.z - Math.cos(m.heading) * 2), 4);
    m.mesh.rotation.set(-tilt, m.heading, 0, 'YXZ');
    const u = m.mesh.userData;
    if (m.type === 'excavator') { u.house.rotation.y = m.swing; u.boom.rotation.x = m.boom; u.stick.rotation.x = m.stick; u.load.visible = !!m.bucketFull; }
    else { u.arms.rotation.x = m.cargo > 0 ? -0.45 : 0.15; u.load.visible = m.cargo > 0; }
  }
  for (const s of structures) if (s.kind === 'plant' && s.running) s.mesh.userData.trommel.rotation.y += dt * 2.5;
}
let last = performance.now(), uiT = 0;
const perf = { frames: 0, t: 0, sim: 0, draw: 0 };
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  const t0 = performance.now();
  keyPan(real);
  const sc = race.active ? (Date.now() < race.startAt || ledger.over ? 0 : 1) : timeScale;
  let acc = real * sc;
  while (acc > 0) { const d = Math.min(acc, 0.05); step(d); acc -= d; }
  syncMeshes(real * sc);
  updateEffects(real * sc);
  flushTerrain();
  const t1 = performance.now();
  placeCamera();
  renderer.render(scene, camera);
  drawHUD();
  updateAmbience();
  const t2 = performance.now();
  perf.sim += t1 - t0; perf.draw += t2 - t1; perf.frames++; perf.t += real;
  if (perf.t >= 0.5) { $('#perf').textContent = `${Math.round(perf.frames / perf.t)} fps · logic ${(perf.sim / perf.frames).toFixed(1)} ms · draw ${(perf.draw / perf.frames).toFixed(1)} ms`; perf.frames = 0; perf.t = 0; perf.sim = 0; perf.draw = 0; }
  uiT -= real;
  if (uiT <= 0) { uiT = 0.4; renderStats(); refreshCmd(); renderBoard(); pushPresence(); }
  requestAnimationFrame(frame);
}
function resize() { renderer.setSize(glCanvas.clientWidth, glCanvas.clientHeight, false); }
window.addEventListener('resize', resize);

setupClaim();
for (const s of structures) if (s.kind === 'pump') s.wetOK = waterNear(s.x, s.z, 9) > 0;
window.__claim = { machines, structures, piles, ledger, T, digAt };
resize();
renderStats();
refreshCmd();
toast('Your claim. Select the excavator and tap Dig here near the plant. The old riverbed runs right through it.', 5500);
requestAnimationFrame(frame);
})();
