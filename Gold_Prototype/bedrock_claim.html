<title>Bedrock Claim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen isometric claim; a weathered assay-office HUD floats on top (ledger strip, controls, command bar, side drawer). */
:root {
  --bg: #15130f;
  --panel: rgba(27, 23, 17, 0.93);
  --panel-solid: #1d1913;
  --line: #3b3226;
  --ink: #efe5cf;
  --muted: #a99b80;
  --gold: #e3b448;
  --water: #6fb1d6;
  --danger: #d4574a;
  --ok: #8db36a;
  --display: "Rye", "Georgia", serif;
  --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
button, select { font-family: var(--ui); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); }
button { background: #2a241b; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; min-height: 36px; }
button:hover { border-color: #5a4c38; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button.on { background: var(--gold); color: #241a05; border-color: var(--gold); }
button.dim { opacity: 0.5; }
button.warn { border-color: #6b3a33; color: #f0b8ad; }
button.goldbtn { background: #4a3812; border-color: var(--gold); color: #ffe3a0; }

.topbar { position: absolute; top: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.ledger { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 7px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ledger h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.1; color: var(--gold); letter-spacing: 0.02em; }
.stats { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--gold); font-weight: 700; }
.stats .neg { color: var(--danger); }
.perf { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.seg { display: inline-flex; gap: 2px; }
.seg button { border-radius: 4px; padding: 7px 9px; }

.cmdbar { position: absolute; bottom: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: flex-end; pointer-events: none; }
.cmdbar > * { pointer-events: auto; }
.selpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 680px; }
.selinfo { font-size: 15px; line-height: 1.25; }
.selinfo b { color: var(--gold); font-weight: 700; }
.selinfo .st { color: var(--muted); font-size: 13px; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; }

#toast { position: absolute; left: 50%; transform: translateX(-50%); top: 92px; background: var(--panel-solid); border: 1px solid var(--gold); color: var(--ink); border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); font-size: 15px; z-index: 5; }
#toast button { min-height: 30px; padding: 4px 10px; }

#drawer { position: absolute; top: 76px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 96px; width: 370px; max-width: calc(100% - 24px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 8px; }
.dhead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--gold); }
.dbody { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.dbody h3 { margin: 4px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.dbody p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.shopitem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
.shopitem .nm { font-weight: 700; font-size: 16px; }
.shopitem .ds { grid-column: 1 / 2; color: var(--muted); font-size: 13px; line-height: 1.3; }
.shopitem button { grid-row: 1 / 3; grid-column: 2; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.slider label { font-size: 14px; }
.slider output { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 600; font-size: 14px; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); }
.slider.changed label::after { content: " · changed"; color: var(--gold); }
.copybox { width: 100%; min-height: 90px; background: #12100c; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 6px; }
table.rep { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.rep td { padding: 5px 4px; border-bottom: 1px solid #2c261d; }
table.rep td.n { text-align: right; color: var(--gold); font-weight: 600; }
.board { display: flex; flex-direction: column; gap: 1px; font-size: 14px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; }
#mini { width: 132px; height: 132px; border-radius: 6px; border: 1px solid var(--line); margin-top: 4px; cursor: pointer; }
@media (max-width: 640px) { #mini { width: 96px; height: 96px; } }
.board .me { color: var(--gold); font-weight: 700; }
.field { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.field input, .field select { background: #12100c; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; color: var(--ink); min-height: 36px; font-family: var(--ui); font-size: 16px; }
#stickZone { position: absolute; left: 0; bottom: 0; width: 50%; height: 55%; touch-action: none; z-index: 3; }
.stick { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(239,229,207,.55); background: rgba(20,16,10,.3); pointer-events: none; left: 90px; top: calc(100% - 100px); }
.stick i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(227,180,72,.9); }
#tbtns { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 24px; display: grid; grid-template-columns: auto auto; gap: 12px; z-index: 4; }
.tb { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #241a05; background: var(--gold); color: #241a05; font-weight: 700; font-size: 15px; padding: 0; touch-action: none; }
.tb.alt { background: #efe5cf; }
.tb.down { transform: translateY(2px); filter: brightness(.85); }
body.drivetouch .cmdbar { display: none; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; margin: 0; }
.keys dt { color: var(--gold); font-weight: 600; }
.keys dd { margin: 0; }

@media (max-width: 640px) {
  .ledger h1 { font-size: 17px; }
  .stats { font-size: 13px; gap: 0 10px; }
  #drawer { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; bottom: 8px; height: 62%; }
  #toast { top: auto; bottom: 150px; }
}
</style>

<div id="app">
  <canvas id="gl" aria-label="Mining claim"></canvas>
  <canvas id="hud"></canvas>

  <header class="topbar">
    <div class="ledger">
      <h1>Bedrock Claim</h1>
      <div class="stats" id="stats"></div>
      <div class="perf" id="perf">measuring…</div>
      <div class="board" id="board" hidden></div>
      <canvas id="mini" width="132" height="132" aria-label="Map of the claims"></canvas>
    </div>
    <div class="controls">
      <div class="seg" id="speedSeg" role="group" aria-label="Game speed">
        <button data-speed="0">Pause</button>
        <button data-speed="1" class="on">1×</button>
        <button data-speed="2">2×</button>
        <button data-speed="4">4×</button>
      </div>
      <button id="viewBtn">Boss view</button>
      <button data-drawer="race">Race</button>
      <button data-drawer="shop">Shop</button>
      <button data-drawer="crew">Crew</button>
      <button id="surveyBtn">Survey</button>
      <button data-drawer="tune">Tune</button>
      <button id="sndBtn" aria-pressed="true">Tap for sound</button>
      <button data-drawer="help">Controls</button>
    </div>
  </header>

  <div id="stickZone" hidden><div class="stick" id="stick"><i></i></div></div>
  <div id="tbtns" hidden>
    <button class="tb alt" id="tbL" type="button" hidden>◀</button>
    <button class="tb alt" id="tbR" type="button" hidden>▶</button>
    <button class="tb alt" id="tbDash" type="button" hidden>Run</button>
    <button class="tb alt" id="tbBomb" type="button" hidden>Bomb</button>
    <button class="tb alt" id="tbBerm" type="button" hidden>Berm</button>

  </div>
  <div id="toast" hidden><span id="toastText"></span><button id="toastCancel">Cancel</button></div>

  <footer class="cmdbar">
    <div class="selpanel">
      <div class="selinfo" id="selInfo"></div>
      <div class="cmds" id="cmds"></div>
    </div>
  </footer>

  <aside id="drawer" hidden>
    <div class="dhead"><h2 id="drawerTitle">Shop</h2><button id="drawerClose">Close</button></div>
    <div class="dbody" id="drawerBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// =============================================================== tuning
const DEFAULT_T = {
  digRate: 0.8, bucket: 1.6, siteRadius: 3.5, loaderCap: 1.6, washRate: 0.14, hopperCap: 20, recovery: 0.85, cutoff: 0.6,
  wage: 0.9, fuelExc: 0.35, fuelLoader: 0.15, fuelGen: 0.4, fuelPump: 0.12, repose: 0.75, goldPrice: 115, seasonMin: 20,
};
const T_FIELDS = [
  ['digRate', 'Excavator digging, m³ per second', 0.05, 2, 0.05], ['bucket', 'Excavator bucket, m³', 0.3, 4, 0.1], ['siteRadius', 'Dig site radius, m', 2, 10, 0.5],
  ['loaderCap', 'Loader bucket, m³', 0.5, 6, 0.1], ['washRate', 'Wash plant, m³ per second', 0.02, 1, 0.01], ['hopperCap', 'Wash plant hopper, m³', 4, 80, 1],
  ['recovery', 'Gold recovery at the plant', 0.3, 1, 0.01], ['cutoff', 'Pay dirt cutoff, g per m³', 0, 4, 0.1],
  ['wage', 'Wage per worker, $ per second', 0, 5, 0.1], ['fuelExc', 'Excavator diesel, $ per second', 0, 3, 0.05], ['fuelLoader', 'Loader diesel, $ per second', 0, 3, 0.05],
  ['fuelGen', 'Generator diesel, $ per second', 0, 3, 0.05], ['fuelPump', 'Pump diesel, $ per second', 0, 2, 0.02], ['repose', 'Pile steepness (angle of repose)', 0.3, 1.5, 0.05],
  ['goldPrice', 'Starting gold price, $ per gram', 20, 400, 5], ['seasonMin', 'Season length, minutes', 5, 90, 1],
];
const T = Object.assign({}, DEFAULT_T);
const STORE_KEY = 'bedrockClaim.tune.v1';
try { Object.assign(T, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) { /* storage unavailable */ }
function saveTune() { try { localStorage.setItem(STORE_KEY, JSON.stringify(T)); } catch (e) { /* ignore */ } }
const PRICES = { excavator: 14000, loader: 6000, pump: 2500, generator: 8000, plant: 18000, bunkhouse: 5000, survey: 1500, hire: 600 };

// =============================================================== ground: surface, overburden, pay gravel, bedrock
const SIZE = 400, N = 321, CELL = SIZE / (N - 1), HALF = SIZE / 2, NN = N * N, WATER_Y = -1.4;
const H = new Float32Array(NN), H0 = new Float32Array(NN), PAYTOP = new Float32Array(NN), BEDR = new Float32Array(NN), GRADE = new Float32Array(NN);
const loose = new Float32Array(NN), looseKind = new Uint8Array(NN);
const I = (i, j) => j * N + i;
const gx = x => (x + HALF) / CELL;
const wx = i => i * CELL - HALF;
function hAt(x, z) {
  const fx = clamp(gx(x), 0, N - 1.0001), fz = clamp(gx(z), 0, N - 1.0001);
  const i = fx | 0, j = fz | 0, u = fx - i, v = fz - j;
  return lerp(lerp(H[I(i, j)], H[I(i + 1, j)], u), lerp(H[I(i, j + 1)], H[I(i + 1, j + 1)], u), v);
}
let seed = 20261030;
function srand() { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const hash = (i, j) => { const s = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return s - Math.floor(s); };
// 8 claims in a ring around the mesa town, rotationally identical so every slot is fair.
const SLOTS = 8, SEG = Math.PI * 2 / SLOTS, CLAIM_R = 120;
function localOf(x, z) {
  // nearest claim slot, and (u, v): u points away from town, v runs sideways across the claim
  const k = ((Math.round(Math.atan2(x, z) / SEG) % SLOTS) + SLOTS) % SLOTS, a = k * SEG, ox = Math.sin(a), oz = Math.cos(a);
  const px = x - ox * CLAIM_R, pz = z - oz * CLAIM_R;
  return { k, u: px * ox + pz * oz, v: px * oz - pz * ox };
}
function worldOf(k, u, v) { const a = k * SEG, ox = Math.sin(a), oz = Math.cos(a); return [ox * (CLAIM_R + u) + oz * v, oz * (CLAIM_R + u) - ox * v]; }
const LOCAL_POCKETS = [[-8, -14, 3, 9], [14, 10, 2.5, 10], [2, 26, 3, 7]];
const POND = [30, 16];
const TOWN = { x: 0, z: 0, r: 22, h: 8 };
const ROAD_IN = 20, ROAD_OUT = CLAIM_R - 34;
const ROADK = new Uint8Array(NN);
function natural(x, z) {
  const r = Math.hypot(x, z), f = ((Math.atan2(x, z) % SEG) + SEG) % SEG, off = Math.min(f, SEG - f), arc = off * r;
  let h = 0.9 + 0.6 * Math.sin(r * 0.05) * Math.cos(arc * 0.06) + 0.4 * Math.sin(r * 0.11 + arc * 0.08);
  h += TOWN.h * smooth(TOWN.r + 16, TOWN.r + 2, r);                                                    // the mesa
  h += 7 * smooth(SEG * 0.3, SEG * 0.5, off) * smooth(48, 72, r) * (1 - 0.85 * Math.exp(-((r - 150) ** 2) / 200)); // ridges between claims, with a pass
  h += 6 * smooth(178, 198, r);                                                                       // outer rim
  return h;
}
function genGround() {
  const h0 = natural(0, ROAD_OUT), h1 = natural(0, 0);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = wx(i), z = wx(j), k = I(i, j), r = Math.hypot(x, z), L = localOf(x, z);
    let h = natural(x, z);
    // a graded road from every claim straight up the mesa
    const rd = r > ROAD_IN - 4 && r < ROAD_OUT + 4 ? Math.abs(L.v) : 1e9;
    if (rd < 8) h = lerp(h, lerp(h1, h0, clamp((r - ROAD_IN) / (ROAD_OUT - ROAD_IN), 0, 1)), 1 - smooth(3, 8, rd));
    if (r < TOWN.r + 2) h = lerp(h, h1, 1 - smooth(TOWN.r - 4, TOWN.r + 2, r));
    ROADK[k] = rd < 2.6 || r < 16 ? 1 : 0;
    const pd = dist(L.u, L.v, POND[0], POND[1]);
    h = lerp(h, -2.8, smooth(9, 4, pd));
    H[k] = H0[k] = h;
    const over = 1.4 + 0.9 * (0.5 + 0.5 * Math.sin(L.u * 0.07 + L.v * 0.05)) + Math.max(0, h) * 0.22;
    const pay = 1.6 + 0.8 * (0.5 + 0.5 * Math.cos(L.u * 0.05 - L.v * 0.06));
    PAYTOP[k] = h - (pd < 7 ? 0.4 : over);
    BEDR[k] = PAYTOP[k] - pay;
    const dp = Math.abs(L.u - (6 * Math.sin(L.v * 0.07) - 4));
    let g = (0.15 + 4.0 * Math.exp(-(dp * dp) / (2 * 9 * 9))) * (0.65 + 0.7 * hash(Math.round(L.u / CELL), Math.round(L.v / CELL)));
    for (const [pu, pv, pr, pg] of LOCAL_POCKETS) g += pg * Math.exp(-((L.u - pu) ** 2 + (L.v - pv) ** 2) / (2 * pr * pr));
    // rich ground around the foot of the mesa: worth fighting over
    const mid = ((Math.atan2(x, z) + SEG / 2) % SEG + SEG) % SEG, md = dist(r, Math.min(mid, SEG - mid) * r, 54, SEG / 2 * 54);
    g += 14 * Math.exp(-(md * md) / (2 * 4 * 4));
    GRADE[k] = g;
  }
}
genGround();

// =============================================================== three.js
const glCanvas = $('#gl'), hud = $('#hud'), hctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8b3a1);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -600, 1200);
scene.add(new THREE.HemisphereLight(0xf2ead8, 0x4d4130, 0.8));
const sunL = new THREE.DirectionalLight(0xfff0d0, 0.85); sunL.position.set(-60, 120, -40); scene.add(sunL);

const tGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(NN * 3), tCol = new Float32Array(NN * 3), tNrm = new Float32Array(NN * 3), tIdx = new Uint32Array((N - 1) * (N - 1) * 6);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = I(i, j); tPos[k * 3] = wx(i); tPos[k * 3 + 1] = H[k]; tPos[k * 3 + 2] = wx(j); }
{ let p = 0; for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { const a = I(i, j), b = I(i, j + 1), c = I(i + 1, j), d = I(i + 1, j + 1); tIdx[p++] = a; tIdx[p++] = b; tIdx[p++] = c; tIdx[p++] = c; tIdx[p++] = b; tIdx[p++] = d; } }
tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
tGeo.setAttribute('normal', new THREE.BufferAttribute(tNrm, 3));
tGeo.setIndex(new THREE.BufferAttribute(tIdx, 1));
const terrain = new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
scene.add(terrain);
const water = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE), new THREE.MeshLambertMaterial({ color: 0x3f6f8a, transparent: true, opacity: 0.78, depthWrite: false }));
water.rotation.x = -Math.PI / 2; water.position.y = WATER_Y; scene.add(water);
const base = new THREE.Mesh(new THREE.BoxGeometry(SIZE, 8, SIZE), new THREE.MeshLambertMaterial({ color: 0x5a4a36 }));
base.position.y = -8; scene.add(base);
let survey = false;
function normalAt(i, j) {
  const k = I(i, j);
  const nx = (H[I(Math.max(i - 1, 0), j)] - H[I(Math.min(i + 1, N - 1), j)]) / (2 * CELL);
  const nz = (H[I(i, Math.max(j - 1, 0))] - H[I(i, Math.min(j + 1, N - 1))]) / (2 * CELL);
  const L = Math.hypot(nx, 1, nz);
  tNrm[k * 3] = nx / L; tNrm[k * 3 + 1] = 1 / L; tNrm[k * 3 + 2] = nz / L;
}
function colorVertex(i, j) {
  const k = I(i, j), h = H[k], v = (hash(i, j) - 0.5) * 0.05;
  let c;
  if (loose[k] > 0.05) c = looseKind[k] === 2 ? [0.46, 0.29, 0.17] : looseKind[k] === 3 ? [0.63, 0.61, 0.55] : [0.56, 0.46, 0.33];
  else if (H0[k] < WATER_Y) c = [0.46, 0.43, 0.34];
  else if (h < H0[k] - 0.15) {
    if (h > PAYTOP[k] + 0.05) c = [0.43, 0.32, 0.21];
    else if (h > BEDR[k] + 0.05) { const sp = hash(i * 3, j * 7) > 0.85 ? 0.08 : 0; c = [0.62 + sp, 0.46 + sp, 0.27]; }

  toast(`${why || 'You got shot'}. ${g > 0.05 ? `You dropped ${g.toFixed(1)} g. ` : ''}Back at your claim in 6 seconds.`, 4000);
  updateTouchUI(); refreshCmd();
}
function dropLoot(x, z, g) {
  const mesh = new THREE.Group();
  add(mesh, box(0.7, 0.6, 0.7), M(0x7a5634), 0, 0.3, 0); add(mesh, box(0.4, 0.15, 0.4), M(0xe3b448), 0, 0.68, 0);
  mesh.position.set(x, hAt(x, z), z); scene.add(mesh);

}
function heroAbilities(inp, dt) {
  if (aim.mouse && aim.pt) jim.yaw = Math.atan2(aim.pt[0] - jim.x, aim.pt[1] - jim.z);
  const loadable = ledger.goldSafe > 0.05 && nearPlant(jim.x, jim.z, 4) && !hostiles().some(h => dist(h.x, h.z, jim.x, jim.z) < 30);
  if (inp.action && loadable) { jim.carry += ledger.goldSafe; toast(`Loaded ${ledger.goldSafe.toFixed(1)} g. That is ${jim.carry.toFixed(0)} lb with the black-sand concentrate. ${jim.carry > 40 ? 'Heavy: the 4x4 carries it easier.' : ''}`, 3200); ledger.goldSafe = 0; sfx('dump', jim.x, jim.z); }
  else if (inp.action || aim.firing) shoot();
  if (inp.bomb) {
    if (jim.cd.bomb > 0) toast(`Satchel ready in ${jim.cd.bomb.toFixed(0)} s.`, 900);
    else {
      jim.cd.bomb = COOL.bomb;
      const tg = hostiles().map(h => ({ ...h, d: dist(h.x, h.z, jim.x, jim.z) })).filter(h => h.d < 18).sort((a, b) => a.d - b.d)[0];
      let tx = tg ? tg.x : jim.x + Math.sin(jim.yaw) * 12, tz = tg ? tg.z : jim.z + Math.cos(jim.yaw) * 12;
      if (aim.mouse && aim.pt) { const d = Math.min(20, dist(aim.pt[0], aim.pt[1], jim.x, jim.z)), a = Math.atan2(aim.pt[0] - jim.x, aim.pt[1] - jim.z); tx = jim.x + Math.sin(a) * d; tz = jim.z + Math.cos(a) * d; }
      const mesh = add(scene, box(0.4, 0.3, 0.3), M(0x6b2a1a), jim.x, hAt(jim.x, jim.z) + 1.5, jim.z);
      bombs.push({ x0: jim.x, z0: jim.z, x1: tx, z1: tz, t: 0, T: 0.9, mesh });
    }
  }
  if (inp.berm) {
    if (jim.cd.berm > 0) toast(`Berm ready in ${jim.cd.berm.toFixed(0)} s.`, 900);
    else {
      jim.cd.berm = COOL.berm;
      const fx = Math.sin(jim.yaw), fz = Math.cos(jim.yaw);
      for (const side of [-2.4, -1.2, 0, 1.2, 2.4]) deposit(jim.x + fx * 2.6 + fz * side, jim.z + fz * 2.6 - fx * side, 4.2, 1);
      sfx('dump', jim.x, jim.z); puff(dustTex, jim.x + fx * 2.6, hAt(jim.x, jim.z) + 1, jim.z + fz * 2.6, 4, 1.4, 0.6);
    }

}
// a crater, like the RTS's Crater_0, but it stops at bedrock
function blast(x, z) {
  const [i0, j0, i1, j1] = cellBox(x, z, 3.2);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const d = dist(wx(i), wx(j), x, z); if (d > 3.2) continue;
    const k = I(i, j), cut = 1.3 * (1 - (d / 3.2) ** 2);
    H[k] = Math.max(BEDR[k] + 0.02, H[k] - cut); loose[k] = Math.max(0, loose[k] - cut);
  }
  markDirty(i0, j0, i1, j1);
  sfx('boom', x, z);
  puff(sparkTex, x, hAt(x, z) + 1.5, z, 7, 0.35, 0, true);
  for (let n = 0; n < 7; n++) puff(smokeTex, x + rand(-2, 2), hAt(x, z) + rand(1, 3), z + rand(-2, 2), rand(4, 6), rand(2, 3.5), rand(0.6, 1.4));
  for (const f of foes) if (f.hp > 0) { const d = dist(f.x, f.z, x, z); if (d < 5.5) hurtBandit(f, 90 * (1 - d / 5.5)); }
  for (const h of hostiles()) if (h.kind === 'player') { const d = dist(h.x, h.z, x, z); if (d < 5.5) myShots.push([++shotSeq, h.peer, Math.round(90 * (1 - d / 5.5))]); }
  const dm = dist(jim.x, jim.z, x, z);
  if (dm < 5.5) hurtMe(90 * (1 - dm / 5.5), 'Caught in your own blast');
}
function spawnBandits() {
  const a = Math.atan2(jim.x, jim.z) + rand(-0.6, 0.6), r = Math.min(dist(jim.x, jim.z, 0, 0) + 24, 70);
  for (let n = 0; n < 2; n++) {
    const x = Math.sin(a + n * 0.15) * r, z = Math.cos(a + n * 0.15) * r, mesh = makeJimbo(0x262626, 0x111111);
    scene.add(mesh);
    foes.push({ x, z, hp: 75, yaw: 0, cool: rand(1, 2), mesh, walk: 0 });
  }
  toast('Bandits! They want your gold. Click to shoot, Shift sprints, right click or G throws a satchel, B digs in.', 4500);
}
function combatTick(dt) {
  for (const t of tracers) if (t.t > 0) { t.t -= 1 / 60; if (t.t <= 0) t.line.visible = false; }
  if (!dt) return;
  for (const k in jim.cd) jim.cd[k] = Math.max(0, jim.cd[k] - dt);
  if (jim.dead) {
    jim.respawnT -= dt;
    if (jim.respawnT <= 0) { const [x, z] = worldOf(home, -30, -11); Object.assign(jim, { x, z, hp: 100, dead: false }); cam.x = x; cam.z = z; updateTouchUI(); refreshCmd(); }
  } else if (jim.hp < 100) jim.hp = Math.min(100, jim.hp + dt * 2);
  // satchels in flight
  for (let n = bombs.length - 1; n >= 0; n--) {
    const b = bombs[n]; b.t += dt;
    const u = Math.min(1, b.t / b.T), x = lerp(b.x0, b.x1, u), z = lerp(b.z0, b.z1, u);
    b.mesh.position.set(x, lerp(hAt(b.x0, b.z0), hAt(b.x1, b.z1), u) + 1.5 + 6 * u * (1 - u), z); b.mesh.rotation.x += dt * 9;
    if (u >= 1) { scene.remove(b.mesh); bombs.splice(n, 1); blast(b.x1, b.z1); }
  }
  // bandits show up when you carry gold near town
  const nearTown = dist(jim.x, jim.z, 0, 0) < 80;
  if (!foes.some(f => f.hp > 0)) banditT -= dt;
  if (banditT <= 0 && nearTown && carried() > 3 && !jim.dead) { banditT = 75; spawnBandits(); }
  for (let n = foes.length - 1; n >= 0; n--) {
    const f = foes[n];
    if (f.hp <= 0) { f.dead = (f.dead || 0) + dt; if (f.dead > 8) { scene.remove(f.mesh); foes.splice(n, 1); } continue; }
    const d = dist(f.x, f.z, jim.x, jim.z);
    f.yaw = Math.atan2(jim.x - f.x, jim.z - f.z);
    f.strafeT = (f.strafeT || 0) - dt; if (f.strafeT <= 0) { f.strafeT = rand(0.8, 1.8); f.side = Math.random() < 0.5 ? -1 : 1; }
    const adv = !jim.dead && (d > 18 || !clearShot(f.x, f.z, jim.x, jim.z)) ? 1 : d < 10 ? -0.6 : 0;
    if (!jim.dead) { const sx = Math.cos(f.yaw) * f.side, sz = -Math.sin(f.yaw) * f.side; f.x += (Math.sin(f.yaw) * adv * 4.5 + sx * 3) * dt; f.z += (Math.cos(f.yaw) * adv * 4.5 + sz * 3) * dt; f.walk += dt * 9; pushOut(f, 0.5); }
    f.cool -= dt;
    if (f.cool <= 0 && !jim.dead && d < 32) {
      f.cool = rand(0.9, 1.5);
      const open = clearShot(f.x, f.z, jim.x, jim.z), hit = open && Math.random() < hitChance(d, sprinting()) * 0.55;
      sfx('shot', f.x, f.z);
      tracer(f.x, hAt(f.x, f.z) + 1.6, f.z, jim.x + (hit ? 0 : rand(-1.5, 1.5)), hAt(jim.x, jim.z) + 1.2, jim.z + (hit ? 0 : rand(-1.5, 1.5)));
      if (hit) hurtMe(14, 'A bandit got you');
    }
    if (dist(f.x, f.z, 0, 0) > 120 && jim.dead) f.hp = 0;
    f.mesh.position.set(f.x, hAt(f.x, f.z), f.z); f.mesh.rotation.y = f.yaw;
    const legs = f.mesh.userData.legs; legs[0].rotation.x = Math.sin(f.walk) * 0.5; legs[1].rotation.x = -legs[0].rotation.x;
  }
  // loot: walk over a sack to grab it
  for (let n = loots.length - 1; n >= 0; n--) {
    const l = loots[n];
    l.mesh.rotation.y += dt;
    if (jim.dead || dist(l.x, l.z, jim.x, jim.z) > 2.2) continue;
    if (l.own) { jim.carry += l.g; scene.remove(l.mesh); loots.splice(n, 1); toast(`Picked up ${l.g.toFixed(1)} g.`, 1600); sfx('ding', jim.x, jim.z); }
    else if (!myPicks.some(p => p[0] === l.peer && p[1] === l.id)) myPicks.push([l.peer, l.id]);
  }
}
// --- combat over the network: shooters report hits, victims apply them; loot owners grant pickups
function combatState() {
  while (myShots.length > 8) myShots.shift();
  while (myGrants.length > 8) myGrants.shift();
  while (myPicks.length > 6) myPicks.shift();
  return { hp: Math.round(jim.dead ? 0 : jim.hp), d: sprinting() ? 1 : 0, sh: myShots.slice(), lt: loots.filter(l => l.own).slice(0, 8).map(l => [l.id, r1(l.x), r1(l.z), r1(l.g)]), gv: myGrants.slice(), pk: myPicks.slice() };
}
function readGhostCombat(peer, g, c, num) {
  if (!c || typeof c !== 'object') return;
  g.hp = num(c.hp); g.dash = !!c.d;
  const me = myPeer();
  g.seenShots = g.seenShots || new Set();
  for (const s of Array.isArray(c.sh) ? c.sh : []) {
    if (!Array.isArray(s) || g.seenShots.has(s[0])) continue;
    g.seenShots.add(s[0]);
    if (g.jt) { const y = hAt(g.jx, g.jz) + 1.6; sfx('shot', g.jx, g.jz); if (s[1] === me) tracer(g.jx, y, g.jz, jim.x, hAt(jim.x, jim.z) + 1.2, jim.z); }
    if (s[1] === me) hurtMe(clamp(num(s[2]), 0, 100), `${g.nick} got you`);
  }
  // their dropped sacks
  g.loot = g.loot || new Map();
  const live = new Set();
  for (const l of Array.isArray(c.lt) ? c.lt.slice(0, 8) : []) {
    if (!Array.isArray(l)) continue;
    const id = num(l[0]); live.add(id);
    if (!g.loot.has(id)) { const before = loots.length; dropLoot(num(l[1]), num(l[2]), num(l[3])); const L = loots[before]; L.own = false; L.peer = peer; L.id = id; g.loot.set(id, L); }
  }
  for (const [id, L] of g.loot) if (!live.has(id)) { scene.remove(L.mesh); const n = loots.indexOf(L); if (n >= 0) loots.splice(n, 1); g.loot.delete(id); }
  // they granted us a sack
  g.seenGrants = g.seenGrants || new Set();
  for (const gr of Array.isArray(c.gv) ? c.gv : []) {
    if (!Array.isArray(gr) || gr[1] !== me || g.seenGrants.has(gr[0])) continue;
    g.seenGrants.add(gr[0]); jim.carry += clamp(num(gr[2]), 0, 1e4); toast(`Grabbed ${num(gr[2]).toFixed(1)} g from ${g.nick}.`, 2000); sfx('ding', jim.x, jim.z);
  }
  // they want one of ours: first come, first served
  for (const pk of Array.isArray(c.pk) ? c.pk : []) {
    if (!Array.isArray(pk) || pk[0] !== me) continue;
    if (typeof pk[1] === 'string' && pk[1][0] === 'v') {
      const m = machines[+pk[1].slice(1)];
      if (m && m.type === 'suv' && m.cargoGold > 0.05 && jim.driving !== m && g.jt && dist(g.jx, g.jz, m.x, m.z) < 8) {
        myGrants.push(['v' + (++lootSeq), peer, r1(m.cargoGold)]); toast(`${g.nick} robbed ${m.cargoGold.toFixed(1)} g out of your 4x4!`, 3000); m.cargoGold = 0;
      }
      continue;
    }
    const n = loots.findIndex(l => l.own && l.id === pk[1]);
    if (n < 0) continue;
    const L = loots[n]; scene.remove(L.mesh); loots.splice(n, 1); myGrants.push([L.id, peer, r1(L.g)]);
  }
}

// =============================================================== loop
function syncMeshes(dt) {
  for (const m of machines) {
    m.mesh.position.set(m.x, m.y, m.z);
    const tilt = Math.atan2(hAt(m.x + Math.sin(m.heading) * 2, m.z + Math.cos(m.heading) * 2) - hAt(m.x - Math.sin(m.heading) * 2, m.z - Math.cos(m.heading) * 2), 4);
    m.mesh.rotation.set(-tilt, m.heading, 0, 'YXZ');
    const u = m.mesh.userData;
    if (m.type === 'excavator') { u.house.rotation.y = m.swing; u.boom.rotation.x = m.boom; u.stick.rotation.x = m.stick; u.load.visible = !!m.bucketFull; }
    else if (m.type === 'loader') { u.arms.rotation.x = m.cargo > 0 ? -0.45 : 0.15; u.load.visible = m.cargo > 0; }
    else { m.spin = (m.spin || 0) + (m.speed || 0) * dt / 0.6; for (const w of u.wheels) w.rotation.x = m.spin; }
  }
  for (const s of structures) if (s.kind === 'plant' && s.running) s.mesh.userData.trommel.rotation.y += dt * 2.5;
}
let last = performance.now(), uiT = 0;
const perf = { frames: 0, t: 0, sim: 0, draw: 0 };
function frame(now) {

  updateEffects(real * sc);
  ghostTick(real);
  combatTick(sc > 0 ? real : 0);
  netT -= real;
  if (netT <= 0) { netT = 0.16; if (race.active) { netTick(); pushPresence(); } }

  placeCamera();
  renderer.render(scene, camera);
  drawHUD();
  updateAmbience();
  const t2 = performance.now();
  perf.sim += t1 - t0; perf.draw += t2 - t1; perf.frames++; perf.t += real;
  if (perf.t >= 0.5) { $('#perf').textContent = `${Math.round(perf.frames / perf.t)} fps · logic ${(perf.sim / perf.frames).toFixed(1)} ms · draw ${(perf.draw / perf.frames).toFixed(1)} ms`; perf.frames = 0; perf.t = 0; perf.sim = 0; perf.draw = 0; }

  if (uiT <= 0) { uiT = 0.4; renderStats(); refreshCmd(); renderBoard(); pushPresence(); updateTouchUI(); drawMini(); }

}

window.__claim = { machines, structures, piles, ledger, T, digAt, jim, TOWN, worldOf, ghosts, H, I: (x, z) => I(Math.round(gx(x)), Math.round(gx(z))), get home() { return home; }, foes, loots, hurtMe, toScreen, aim, setBanditT: v => { banditT = v; } };

toast(touchIn.on ? 'You are Jimbo. Walk to the excavator with the left stick, tap Hop in, swing with ◀ ▶ and tap Dig. Boss view is up top.' : 'You are Jimbo. Walk to the excavator (WASD), hop in with X, swing with Q/E and dig with Space. Tab is the boss view.', 7000);
