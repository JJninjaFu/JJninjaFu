<title>Plateau Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen battlefield; a brass-trimmed field-desk HUD floats over it (top bar, bottom command bar, side drawer). */
:root {
  --bg: #11141a;
  --panel: rgba(19, 23, 30, 0.92);
  --panel-solid: #161b22;
  --line: #2f3742;
  --ink: #ece4d2;
  --muted: #a29a89;
  --brass: #d3aa52;
  --blue: #5b8cf0;
  --grey: #cfc6b6;
  --danger: #d4574a;
  --ok: #7fb069;
  --display: "Rye", "Georgia", serif;
  --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
button, select { font-family: var(--ui); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); }
button { background: #232a34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; min-height: 36px; }
button:hover { border-color: #4a5462; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button.on { background: var(--brass); color: #1a1408; border-color: var(--brass); }
button.warn { border-color: #6b3a33; color: #f0b8ad; }
button.dim { opacity: 0.55; }
.slider.changed label::after { content: " · changed"; color: var(--brass); }
.copybox { width: 100%; min-height: 90px; background: #10141a; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 6px; }
select { background: #232a34; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }

.topbar { position: absolute; top: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 7px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.1; color: var(--brass); letter-spacing: 0.02em; }
.brand .sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.brand .perf { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.seg { display: inline-flex; gap: 2px; }
.seg button { border-radius: 4px; padding: 7px 9px; }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

.cmdbar { position: absolute; bottom: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: flex-end; justify-content: space-between; pointer-events: none; }
.cmdbar > * { pointer-events: auto; }
.selpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 640px; }
.selinfo { font-size: 15px; line-height: 1.25; }
.selinfo b { color: var(--brass); font-weight: 700; }
.selinfo .st { color: var(--muted); font-size: 13px; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; }
.shellbtn { background: #3a2420; border-color: #6b3a33; color: #ffd2c8; white-space: nowrap; }

#toast { position: absolute; left: 50%; transform: translateX(-50%); top: 74px; background: var(--panel-solid); border: 1px solid var(--brass); color: var(--ink); border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); font-size: 15px; z-index: 5; }
#toast button { min-height: 30px; padding: 4px 10px; }

#drawer { position: absolute; top: 64px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 88px; width: 360px; max-width: calc(100% - 24px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 8px; }
.dhead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--brass); }
.dbody { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.dbody h3 { margin: 4px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.dbody p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid2 button { text-align: left; display: flex; justify-content: space-between; gap: 6px; }
.grid2 button span { color: var(--muted); font-weight: 500; }
.grid2 button.on span { color: #3a2c0c; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.slider label { font-size: 14px; }
.slider output { font-variant-numeric: tabular-nums; color: var(--brass); font-weight: 600; font-size: 14px; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--brass); }
table.rep { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.rep th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 4px; border-bottom: 1px solid var(--line); }
table.rep td { padding: 5px 4px; border-bottom: 1px solid #222932; }
table.rep td.n { text-align: right; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
.keys dt { color: var(--brass); font-weight: 600; }
.keys dd { margin: 0; color: var(--ink); }

@media (max-width: 640px) {
  .brand .sub { display: none; }
  .lbl { font-size: 0; gap: 0; }
  .brand h1 { font-size: 17px; }
  #drawer { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; bottom: 8px; height: 62%; }
  .cmdbar { flex-direction: column; align-items: stretch; }
  .shellbtn { align-self: flex-end; }
  #toast { top: auto; bottom: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="app">
  <canvas id="gl" aria-label="Battlefield"></canvas>
  <canvas id="hud"></canvas>

  <header class="topbar">
    <div class="brand">
      <h1>Plateau Sandbox</h1>
      <div class="sub">Empire vs Faithful · field test</div>
      <div class="perf" id="supply"></div>
      <div class="perf" id="perf">measuring…</div>
    </div>
    <div class="controls">
      <div class="seg" id="speedSeg" role="group" aria-label="Game speed">
        <button id="sp0" data-speed="0">Pause</button>
        <button id="sp1" data-speed="1" class="on">1×</button>
        <button id="sp2" data-speed="2">2×</button>
        <button id="sp4" data-speed="4">4×</button>
      </div>
      <label class="lbl" for="aiSel">Auto-battle
        <select id="aiSel">
          <option value="off">Off</option>
          <option value="grey" selected>Faithful</option>
          <option value="blue">Empire</option>
          <option value="both">Both</option>
        </select>
      </label>
      <button id="btnSpawn" data-drawer="spawn">Spawn</button>
      <button id="btnTune" data-drawer="tune">Tune</button>
      <button id="btnReport" data-drawer="report">Report</button>
      <button id="sndBtn" aria-pressed="true">Sound on</button>
      <button id="btnHelp" data-drawer="help" aria-label="Controls">Controls</button>
    </div>
  </header>

  <div id="toast" hidden><span id="toastText"></span><button id="toastCancel">Cancel</button></div>

  <footer class="cmdbar">
    <div class="selpanel">
      <div class="selinfo" id="selInfo"></div>
      <div class="cmds" id="cmds"></div>
    </div>
    <button class="shellbtn" id="shellBtn">Drop shell</button>
  </footer>

  <aside id="drawer" hidden>
    <div class="dhead"><h2 id="drawerTitle">Spawn</h2><button id="drawerClose">Close</button></div>
    <div class="dbody" id="drawerBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const dist = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

// =============================================================== tuning
const DEFAULT_TYPES = {
  rifle:     { name: 'Line Riflemen',      tag: 'RIF', men: 6, hp: 100, speed: 3.2, range: 32, damage: 34,  accuracy: 0.42, reload: 4.5,  suppress: 4 },
  sapper:    { name: 'Sappers',            tag: 'SAP', men: 4, hp: 90,  speed: 3.0, range: 22, damage: 28,  accuracy: 0.35, reload: 5,    suppress: 3 },
  crank:     { name: 'Crank Gun Team',     tag: 'GUN', men: 3, hp: 100, speed: 2.2, range: 44, damage: 14,  accuracy: 0.22, reload: 0.16, suppress: 2.5, gun: 'crank' },
  mortar:    { name: 'Mortar Team',        tag: 'MOR', men: 3, hp: 100, speed: 2.4, range: 70, damage: 80,  accuracy: 0.55, reload: 7,    suppress: 0, splash: 4.5, gun: 'mortar' },
  cannon:    { name: 'Field Gun',          tag: 'CAN', men: 4, hp: 100, speed: 2.0, range: 85, damage: 120, accuracy: 0.75, reload: 9,    suppress: 0, splash: 3.5, gun: 'cannon' },
  cavalry:   { name: 'Iron Horse Cavalry', tag: 'CAV', men: 4, hp: 160, speed: 7.5, range: 2.8, damage: 32, accuracy: 0.6,  reload: 1.8,  suppress: 8, aura: 16 },
  commander: { name: 'Command Staff',      tag: 'CMD', men: 3, hp: 110, speed: 3.4, range: 18, damage: 22,  accuracy: 0.45, reload: 3,    suppress: 3, aura: 22 },
  hover:     { name: 'Hover Skiff',        tag: 'SKF', men: 1, hp: 700, speed: 9,   range: 0,  damage: 0,   accuracy: 0,    reload: 1,    suppress: 0, carry: 10, armor: 0.35, vehicle: true },
};
const COST_TIME = { rifle: [100, 14], sapper: [80, 12], crank: [160, 20], mortar: [180, 22], cannon: [260, 28], cavalry: [220, 24], commander: [200, 26], hover: [240, 26] };
for (const t in COST_TIME) { DEFAULT_TYPES[t].cost = COST_TIME[t][0]; DEFAULT_TYPES[t].build = COST_TIME[t][1]; }
const DEFAULT_BUILD = {
  hq:       { name: 'Headquarters', hp: 2500, cost: 400, build: 60, r: 7.5, makes: ['sapper', 'commander', 'hover'] },
  barracks: { name: 'Barracks',     hp: 1600, cost: 200, build: 40, r: 6,   makes: ['rifle', 'crank', 'mortar', 'cannon', 'cavalry'] },
  turret:   { name: 'Turret',       hp: 700,  cost: 150, build: 25, r: 2.2, range: 42, damage: 20, accuracy: 0.4, reload: 1.1, suppress: 3 },
};
const BUILD_NAMES = { hq: { blue: 'Cloning Vats', grey: 'Sanctum' }, barracks: { blue: 'Barracks', grey: 'Chapter House' }, turret: { blue: 'Auto-Turret', grey: 'Bastion' } };
// Empire: cheap, fast clones who rattle easily. Faithful: costly, tougher, sharper, nearly unbreakable.
const DEFAULT_FACTION = {
  blue: { cost: 0.8, build: 0.8, hp: 1, accuracy: 1, morale: 1.15 },
  grey: { cost: 1.2, build: 1.1, hp: 1.15, accuracy: 1.12, morale: 0.75 },
};
const DEFAULT_WORLD = { repairRate: 1.2, rampRate: 1.6, maxSlope: 0.9, craterScale: 1, craterDepth: 1.3, baseRadius: 20, baseMinDamage: 0.15, income: 3, startSupply: 400 };
const TYPE_ORDER = ['rifle', 'sapper', 'crank', 'mortar', 'cannon', 'cavalry', 'commander', 'hover'];
const UNIT_FIELDS = [
  ['men', 'Men per squad (new squads)', 1, 9, 1], ['hp', 'Health per man (new squads)', 20, 400, 5],
  ['speed', 'Speed, m/s', 0.5, 12, 0.1], ['range', 'Range, m', 2, 120, 1], ['damage', 'Damage per hit', 1, 250, 1],
  ['accuracy', 'Accuracy', 0.02, 1, 0.01], ['reload', 'Reload, seconds', 0.05, 15, 0.05], ['suppress', 'Morale hit per shot', 0, 20, 0.5],
  ['cost', 'Supply cost', 0, 600, 10], ['build', 'Training time, seconds', 1, 90, 1],
];
const BUILD_FIELDS = [['hp', 'Health', 100, 6000, 50], ['cost', 'Supply cost', 0, 800, 10], ['build', 'Build time with a full Sapper squad, s', 2, 180, 1]];
const TURRET_FIELDS = [['range', 'Range, m', 5, 120, 1], ['damage', 'Damage per hit', 1, 150, 1], ['accuracy', 'Accuracy', 0.02, 1, 0.01], ['reload', 'Reload, seconds', 0.1, 10, 0.1]];
const FACTION_FIELDS = [['cost', 'Unit and building cost ×', 0.3, 2, 0.05], ['build', 'Training and building time ×', 0.3, 2, 0.05], ['hp', 'Health ×', 0.5, 2, 0.05], ['accuracy', 'Accuracy ×', 0.5, 2, 0.05], ['morale', 'Morale damage taken ×', 0.2, 2, 0.05]];
const EXTRA_FIELDS = { splash: ['splash', 'Blast radius, m', 1, 12, 0.5], aura: ['aura', 'Aura radius, m', 0, 50, 1], carry: ['carry', 'Passenger seats', 2, 20, 1], armor: ['armor', 'Small-arms damage taken (armor)', 0.05, 1, 0.05] };
const WORLD_FIELDS = [
  ['repairRate', 'Crater repair, m³ per sapper per second', 0.1, 6, 0.1],
  ['rampRate', 'Ramp building, m³ per sapper per second', 0.1, 6, 0.1],
  ['maxSlope', 'Steepest walkable slope (rise per run)', 0.3, 2, 0.05],
  ['craterScale', 'Crater width', 0.2, 3, 0.05],
  ['craterDepth', 'Crater depth, m', 0.2, 4, 0.1],
  ['baseRadius', 'Base protection radius, m', 0, 40, 1],
  ['baseMinDamage', 'Terrain damage at base center (0 to 1)', 0, 1, 0.05],
  ['income', 'Supply income per second, each side', 0, 20, 0.5],
  ['startSupply', 'Starting supply (on restart)', 0, 3000, 50],
];
const TYPES = JSON.parse(JSON.stringify(DEFAULT_TYPES));
const WORLD = Object.assign({}, DEFAULT_WORLD);
const BUILD = JSON.parse(JSON.stringify(DEFAULT_BUILD));
const FACTION = JSON.parse(JSON.stringify(DEFAULT_FACTION));
const STORE_KEY = 'plateauSandbox.tune.v3';
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved) {
    for (const t in saved.types || {}) if (TYPES[t]) Object.assign(TYPES[t], saved.types[t]);
    for (const k in saved.build || {}) if (BUILD[k]) Object.assign(BUILD[k], saved.build[k]);
    for (const f in saved.faction || {}) if (FACTION[f]) Object.assign(FACTION[f], saved.faction[f]);
    Object.assign(WORLD, saved.world || {});
  }
} catch (e) { /* storage unavailable */ }
function saveTune() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ types: TYPES, world: WORLD, build: BUILD, faction: FACTION })); } catch (e) { /* ignore */ } }
const DEFAULTS = new Map([[WORLD, DEFAULT_WORLD]]);
for (const t in TYPES) DEFAULTS.set(TYPES[t], DEFAULT_TYPES[t]);
for (const k in BUILD) DEFAULTS.set(BUILD[k], DEFAULT_BUILD[k]);
for (const f in FACTION) DEFAULTS.set(FACTION[f], DEFAULT_FACTION[f]);
const costOf = (type, team) => Math.round(TYPES[type].cost * FACTION[team].cost);
const trainTime = (type, team) => Math.max(1, TYPES[type].build * FACTION[team].build);
const bCost = (kind, team) => Math.round(BUILD[kind].cost * FACTION[team].cost);
const nameOf = (type, team) => TYPES[type] ? TYPES[type].name : BUILD_NAMES[type] ? BUILD_NAMES[type][team] : type;

const TEAM = {
  blue: { name: 'Empire', css: '#5b8cf0', coat: 0x22335e, trou: 0x6c8fc6, cap: 0x22335e },
  grey: { name: 'Faithful', css: '#cfc6b6', coat: 0x8f8b82, trou: 0x6e6455, cap: 0x8a8379 },
};
const ENEMY = { blue: 'grey', grey: 'blue' };

// =============================================================== terrain
const SIZE = 320, N = 257, CELL = SIZE / (N - 1), HALF = SIZE / 2, BED = -3;
const H = new Float32Array(N * N), H0 = new Float32Array(N * N);
const I = (i, j) => j * N + i;
const gx = x => (x + HALF) / CELL;
const wx = i => i * CELL - HALF;
function hAt(x, z) {
  const fx = clamp(gx(x), 0, N - 1.0001), fz = clamp(gx(z), 0, N - 1.0001);
  const i = fx | 0, j = fz | 0, u = fx - i, v = fz - j;
  return lerp(lerp(H[I(i, j)], H[I(i + 1, j)], u), lerp(H[I(i, j + 1)], H[I(i + 1, j + 1)], u), v);
}
function segProj(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
  const t = ((px - ax) * dx + (pz - az) * dz) / L2;
  const cx = ax + dx * clamp(t, 0, 1), cz = az + dz * clamp(t, 0, 1);
  return { t, d: Math.hypot(px - cx, pz - cz) };
}
const BASES = { blue: { x: 0, z: -128 }, grey: { x: 0, z: 128 } };
const PLATEAUS = [
  { x: -80, z: 12, r: 26, h: 14, ramp: [-80, -66, -80, -15] },
  { x: 80, z: -12, r: 26, h: 14 },
];
const MOUNDS = [[0, 0, 11, 2.6], [-28, -52, 8, 1.6], [32, 48, 8, 1.6], [-124, -80, 13, 2.4], [124, 80, 13, 2.4], [48, -68, 6, 1.4], [-44, 64, 6, 1.4], [-38, -12, 9, 1.8], [38, 12, 9, 1.8], [0, -70, 7, 1.2], [0, 70, 7, 1.2]];
function genTerrain() {
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = wx(i), z = wx(j);
    let h = 1.0 * Math.sin(x * 0.03 + 0.4) * Math.cos(z * 0.025) + 0.55 * Math.sin(x * 0.065 + 1.3) * Math.sin(z * 0.045 + 0.2) + 0.35 * Math.cos(z * 0.06 + x * 0.02);
    for (const [mx, mz, mr, mh] of MOUNDS) { const d = Math.hypot(x - mx, z - mz); h += mh * Math.exp(-(d * d) / (mr * mr)); }
    for (const B of Object.values(BASES)) h = lerp(h, 0.2, smooth(32, 20, Math.hypot(x - B.x, z - B.z)));
    for (const P of PLATEAUS) {
      const d = Math.hypot(x - P.x, z - P.z);
      h = lerp(h, P.h + 0.3 * Math.sin(x * 0.35) * Math.cos(z * 0.3), smooth(P.r + 4.5, P.r, d));
      if (P.ramp) {
        const [ax, az, bx, bz] = P.ramp, s = segProj(x, z, ax, az, bx, bz);
        if (s.t >= -0.02 && s.t <= 1.1) h = Math.max(h, lerp(h, P.h * clamp(s.t, 0, 1), smooth(6.5, 3.5, s.d)));
      }
    }
    H[I(i, j)] = H0[I(i, j)] = h;
  }
}
genTerrain();

// =============================================================== three.js scene
const glCanvas = $('#gl'), hud = $('#hud'), hctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9b7bd);
scene.fog = new THREE.Fog(0xa9b7bd, 260, 700);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 1600);
scene.add(new THREE.HemisphereLight(0xe2ecf2, 0x4b4232, 0.85));
const sun = new THREE.DirectionalLight(0xfff0d4, 0.85); sun.position.set(60, 120, 40); scene.add(sun);

const tGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(N * N * 3), tCol = new Float32Array(N * N * 3);
const tIdx = new Uint32Array((N - 1) * (N - 1) * 6);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = I(i, j); tPos[k * 3] = wx(i); tPos[k * 3 + 1] = H[k]; tPos[k * 3 + 2] = wx(j); }
{ let p = 0; for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { const a = I(i, j), b = I(i, j + 1), c = I(i + 1, j), d = I(i + 1, j + 1); tIdx[p++] = a; tIdx[p++] = b; tIdx[p++] = c; tIdx[p++] = c; tIdx[p++] = b; tIdx[p++] = d; } }
tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
tGeo.setIndex(new THREE.BufferAttribute(tIdx, 1));
const tNrm = new Float32Array(N * N * 3);
tGeo.setAttribute('normal', new THREE.BufferAttribute(tNrm, 3));

function tuningDiff() {
  const out = {};
  const add = (sect, name, obj, def) => {
    for (const k in def) if (typeof def[k] === 'number' && Math.abs(obj[k] - def[k]) > 1e-9) {
      if (!out[sect]) out[sect] = {};
      if (!out[sect][name]) out[sect][name] = {};
      out[sect][name][k] = { was: def[k], now: obj[k] };
    }
  };
  for (const t in TYPES) add('units', t, TYPES[t], DEFAULT_TYPES[t]);
  for (const k in BUILD) add('buildings', k, BUILD[k], DEFAULT_BUILD[k]);
  for (const f in FACTION) add('factions', f === 'blue' ? 'empire' : 'faithful', FACTION[f], DEFAULT_FACTION[f]);
  add('world', 'all', WORLD, DEFAULT_WORLD);
  return out;
}
function copyTuning() {
  const diff = tuningDiff();
  const text = Object.keys(diff).length ? 'Plateau Sandbox tuning: ' + JSON.stringify(diff) : 'Plateau Sandbox tuning: no changes from the defaults.';
  const box = $('#copyBox');
  const show = () => { if (box) { box.hidden = false; box.value = text; box.focus(); box.select(); } };
  try {
    navigator.clipboard.writeText(text).then(() => { toast('Copied. Paste it into the chat.', 2600); show(); }, () => { show(); toast('Select the text below and copy it.', 2600); });
  } catch (e) { show(); toast('Select the text below and copy it.', 2600); }
}

    for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ch.length, 3); }

  if (vol < 0.02) return null;
  const g = ctx.createGain(); g.gain.value = vol;

}
function noiseBurst(out, t0, dur, ftype, f0, f1, q, peak, decay) {
  const ctx = SFX.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = SFX.noise;
  f.type = ftype; f.frequency.setValueAtTime(f0, t0); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t0 + dur); f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + decay);
  src.connect(f); f.connect(g); g.connect(out);

}
function tone(out, t0, type, f0, f1, dur, peak) {
  const ctx = SFX.ctx, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

const REACH = { musket: 260, crank: 260, saber: 120, dig: 90, cannon: 650, mortar: 450, boom: 650, whistle: 300 };
function sfx(kind, x, z) {
  if (!SFX.ctx || !SFX.on || timeScale === 0 || SFX.ctx.state !== 'running') return;
  const now = SFX.ctx.currentTime;
  if (kind === 'musket' || kind === 'crank' || kind === 'saber' || kind === 'dig') {
    if (now - SFX.voiceT > 0.1) { SFX.voiceT = now; SFX.voices = 0; }
    if (++SFX.voices > 10) return;
  }
  let out, delay = 0;
  if (kind === 'click') { out = SFX.ctx.createGain(); out.gain.value = 0.2; out.connect(SFX.master); }
  else { const o = sndOut(x, z, REACH[kind] || 300); if (!o) return; out = o.g; delay = o.delay; }
  const t = now + delay + 0.005;
  switch (kind) {
    case 'musket': noiseBurst(out, t, 0.5, 'bandpass', 1800, 600, 0.6, 0.9, 0.32); tone(out, t, 'sine', 110, 38, 0.18, 0.7); break;
    case 'crank': noiseBurst(out, t, 0.12, 'highpass', 2200, 0, 0.7, 0.6, 0.07); tone(out, t, 'square', 180, 90, 0.04, 0.22); break;
    case 'saber': tone(out, t, 'triangle', 2700, 2500, 0.35, 0.3); tone(out, t, 'sine', 4150, 3900, 0.25, 0.18); noiseBurst(out, t, 0.05, 'highpass', 4000, 0, 0.5, 0.5, 0.04); break;
    case 'dig': noiseBurst(out, t, 0.25, 'bandpass', 650, 350, 1.8, 0.5, 0.2); break;
    case 'cannon': noiseBurst(out, t, 2.0, 'lowpass', 1400, 180, 0.5, 1.0, 1.6); tone(out, t, 'sine', 70, 28, 0.7, 1.0); break;
    case 'mortar': noiseBurst(out, t, 0.6, 'lowpass', 600, 150, 0.6, 0.8, 0.45); tone(out, t, 'sine', 95, 40, 0.3, 0.8); break;
    case 'whistle': {
      const o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(1500, t); o.frequency.exponentialRampToValueAtTime(420, t + 1.3);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.35);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.4); break;
    }
    case 'boom': noiseBurst(out, t, 2.6, 'lowpass', 1200, 120, 0.4, 1.0, 2.2); tone(out, t, 'sine', 60, 24, 0.9, 1.0); noiseBurst(out, t + 0.08, 0.5, 'highpass', 2500, 0, 0.5, 0.25, 0.4); break;
    case 'click': tone(out, t, 'sine', 880, 660, 0.06, 0.5); break;

}
function updateHum() {
  if (!SFX.hum || !SFX.ctx) return;
  let best = 0, moving = false;
  for (const sq of squads) {
    if (sq.dead || !sq.S.vehicle) continue;
    const v = Math.pow(clamp(1 - dist(sq.px, sq.pz, cam.x, cam.z) / 180, 0, 1), 1.5) * clamp(95 / cam.dist, 0.35, 1.2);
    if (v > best) { best = v; moving = sq.moving; }
  }
  const on = SFX.on && timeScale > 0 ? best * (moving ? 0.16 : 0.07) : 0;
  const t = SFX.ctx.currentTime;
  SFX.hum.g.gain.setTargetAtTime(on, t, 0.15);
  SFX.hum.o1.frequency.setTargetAtTime(moving ? 74 : 60, t, 0.3);
  SFX.hum.o2.frequency.setTargetAtTime(moving ? 111 : 90, t, 0.3);
}
$('#sndBtn').addEventListener('click', () => {
  SFX.on = !SFX.on;
  $('#sndBtn').textContent = SFX.on ? 'Sound on' : 'Sound off';
  $('#sndBtn').setAttribute('aria-pressed', String(SFX.on));
  if (SFX.on) audioInit();
});

// =============================================================== loop
function syncMeshes(dt) {
  for (const sq of squads) {
    const sel = selected.has(sq);
    for (const m of sq.members) {
      const g = m.mesh;
      if (m.alive) {
        const bob = sq.order && (sq.order.k === 'repair' || sq.order.k === 'ramp' || sq.order.k === 'build') && !m.moving && sq.order.started !== false ? Math.abs(Math.sin(simTime * 7 + m.k)) * 0.12 : 0;
        g.position.set(m.x, m.y + bob, m.z);
        g.rotation.set(0, m.heading, 0);
        g.userData.ring.visible = sel;
      } else {
        m.deadT += dt;
        if (sq.S.vehicle) g.rotation.set(0, m.heading, Math.min(1, m.deadT * 2) * 0.35);
        else g.rotation.x = -Math.min(1, m.deadT * 3) * Math.PI / 2;
        g.position.y = m.y - Math.max(0, m.deadT - 10) * 0.2;
        if (m.deadT > 16 && g.parent) scene.remove(g);
      }
    }
  }
  for (const g of guns) { g.mesh.position.set(g.x, hAt(g.x, g.z), g.z); g.mesh.rotation.y = g.heading; }
  for (const b of buildings) {
    if (b.dead) continue;
    b.mesh.position.set(b.x, b.y, b.z); b.mesh.rotation.y = b.heading;
    b.mesh.scale.y = 0.12 + 0.88 * b.progress;
    if (b.mesh.userData.head && b.aim != null) b.mesh.userData.head.rotation.y = b.aim - b.heading;
  }
}
function step(dt) {
  simTime += dt;
  updateAuras();
  for (const sq of squads) if (!sq.dead) updateSquad(sq, dt);
  updateProjectiles(dt);
  updateCaptures();
  for (const t in supply) supply[t] += WORLD.income * dt;
  updateBuildings(dt);
  aiT -= dt;
  if (aiT <= 0) { aiT = 1.2; runAI(); }
}
let last = performance.now(), uiT = 0;
const perf = { frames: 0, t: 0, sim: 0, draw: 0 };
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  const t0 = performance.now();
  keyPan(real);
  let acc = real * timeScale;
  while (acc > 0) { const d = Math.min(acc, 0.05); step(d); acc -= d; }
  syncMeshes(real * timeScale);
  updateEffects(real * Math.max(timeScale, 0.0001) || 0);
  flushTerrain();
  const t1 = performance.now();
  placeCamera();
  renderer.render(scene, camera);
  drawHUD();
  updateHum();
  const t2 = performance.now();
  perf.sim += t1 - t0; perf.draw += t2 - t1; perf.frames++; perf.t += real;
  if (perf.t >= 0.5) {
    $('#perf').textContent = `${Math.round(perf.frames / perf.t)} fps · logic ${(perf.sim / perf.frames).toFixed(1)} ms · draw ${(perf.draw / perf.frames).toFixed(1)} ms`;
    perf.frames = 0; perf.t = 0; perf.sim = 0; perf.draw = 0;
  }
  uiT -= real;
  if (uiT <= 0) {
    uiT = 0.4;
    if (selected.size || selB) refreshCmd();
    if (drawer === 'report') renderReport();
    $('#supply').textContent = `Supply · Empire ${Math.floor(supply.blue)} · Faithful ${Math.floor(supply.grey)}`;
  }
  requestAnimationFrame(frame);
}
function resize() {
  const w = glCanvas.clientWidth, h = glCanvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

scenario();
window.__plateau = { squads, buildings, supply, embark, disembark, setOrder, explode, queueUnit, Building };
resize();
refreshCmd();
toast('The Faithful are marching on the Empire. Tap a soldier or a building to take command. Tap anywhere to turn on sound.', 5000);
requestAnimationFrame(frame);
})();
</script>
