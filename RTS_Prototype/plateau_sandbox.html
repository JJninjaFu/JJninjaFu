<title>Plateau Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen battlefield; a brass-trimmed field-desk HUD floats over it (top bar, bottom command bar, side drawer). */
:root {
  --bg: #11141a;
  --panel: rgba(19, 23, 30, 0.92);
  --panel-solid: #161b22;
  --line: #2f3742;
  --ink: #ece4d2;
  --muted: #a29a89;
  --brass: #d3aa52;
  --blue: #5b8cf0;
  --grey: #cfc6b6;
  --danger: #d4574a;
  --ok: #7fb069;
  --display: "Rye", "Georgia", serif;
  --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#gl, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { pointer-events: none; }
button, select { font-family: var(--ui); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; color: var(--ink); }
button { background: #232a34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; min-height: 36px; }
button:hover { border-color: #4a5462; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
button.on { background: var(--brass); color: #1a1408; border-color: var(--brass); }
button.warn { border-color: #6b3a33; color: #f0b8ad; }
select { background: #232a34; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }

.topbar { position: absolute; top: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 7px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.1; color: var(--brass); letter-spacing: 0.02em; }
.brand .sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.seg { display: inline-flex; gap: 2px; }
.seg button { border-radius: 4px; padding: 7px 9px; }
.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }

.cmdbar { position: absolute; bottom: 8px; left: 0; right: 0; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: flex-end; justify-content: space-between; pointer-events: none; }
.cmdbar > * { pointer-events: auto; }
.selpanel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 640px; }
.selinfo { font-size: 15px; line-height: 1.25; }
.selinfo b { color: var(--brass); font-weight: 700; }
.selinfo .st { color: var(--muted); font-size: 13px; }
.cmds { display: flex; flex-wrap: wrap; gap: 6px; }
.shellbtn { background: #3a2420; border-color: #6b3a33; color: #ffd2c8; white-space: nowrap; }

#toast { position: absolute; left: 50%; transform: translateX(-50%); top: 74px; background: var(--panel-solid); border: 1px solid var(--brass); color: var(--ink); border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 32px); font-size: 15px; z-index: 5; }
#toast button { min-height: 30px; padding: 4px 10px; }

#drawer { position: absolute; top: 64px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 88px; width: 360px; max-width: calc(100% - 24px); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.dhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); gap: 8px; }
.dhead h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; color: var(--brass); }
.dbody { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.dbody h3 { margin: 4px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.dbody p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid2 button { text-align: left; display: flex; justify-content: space-between; gap: 6px; }
.grid2 button span { color: var(--muted); font-weight: 500; }
.grid2 button.on span { color: #3a2c0c; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.slider label { font-size: 14px; }
.slider output { font-variant-numeric: tabular-nums; color: var(--brass); font-weight: 600; font-size: 14px; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--brass); }
table.rep { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.rep th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 4px; border-bottom: 1px solid var(--line); }
table.rep td { padding: 5px 4px; border-bottom: 1px solid #222932; }
table.rep td.n { text-align: right; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
.keys dt { color: var(--brass); font-weight: 600; }
.keys dd { margin: 0; color: var(--ink); }

@media (max-width: 640px) {
  .brand .sub { display: none; }
  .lbl { font-size: 0; gap: 0; }
  .brand h1 { font-size: 17px; }
  #drawer { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; max-width: none; bottom: 8px; height: 62%; }
  .cmdbar { flex-direction: column; align-items: stretch; }
  .shellbtn { align-self: flex-end; }
  #toast { top: auto; bottom: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div id="app">
  <canvas id="gl" aria-label="Battlefield"></canvas>
  <canvas id="hud"></canvas>

  <header class="topbar">
    <div class="brand">
      <h1>Plateau Sandbox</h1>
      <div class="sub">Meridian vs Grey Coats · field test</div>
    </div>
    <div class="controls">
      <div class="seg" id="speedSeg" role="group" aria-label="Game speed">
        <button id="sp0" data-speed="0">Pause</button>
        <button id="sp1" data-speed="1" class="on">1×</button>
        <button id="sp2" data-speed="2">2×</button>
        <button id="sp4" data-speed="4">4×</button>
      </div>
      <label class="lbl" for="aiSel">Auto-battle
        <select id="aiSel">
          <option value="off">Off</option>
          <option value="grey" selected>Grey Coats</option>
          <option value="blue">Meridian</option>
          <option value="both">Both</option>
        </select>
      </label>
      <button id="btnSpawn" data-drawer="spawn">Spawn</button>
      <button id="btnTune" data-drawer="tune">Tune</button>
      <button id="btnReport" data-drawer="report">Report</button>
      <button id="btnHelp" data-drawer="help" aria-label="Controls">Controls</button>
    </div>
  </header>

  <div id="toast" hidden><span id="toastText"></span><button id="toastCancel">Cancel</button></div>

  <footer class="cmdbar">
    <div class="selpanel">
      <div class="selinfo" id="selInfo"></div>
      <div class="cmds" id="cmds"></div>
    </div>
    <button class="shellbtn" id="shellBtn">Drop shell</button>
  </footer>

  <aside id="drawer" hidden>
    <div class="dhead"><h2 id="drawerTitle">Spawn</h2><button id="drawerClose">Close</button></div>
    <div class="dbody" id="drawerBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const dist = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);

// =============================================================== tuning
const DEFAULT_TYPES = {
  rifle:     { name: 'Line Riflemen',      tag: 'RIF', men: 6, hp: 100, speed: 3.2, range: 32, damage: 34,  accuracy: 0.42, reload: 4.5,  suppress: 4 },
  sapper:    { name: 'Sappers',            tag: 'SAP', men: 4, hp: 90,  speed: 3.0, range: 22, damage: 28,  accuracy: 0.35, reload: 5,    suppress: 3 },
  crank:     { name: 'Crank Gun Team',     tag: 'GUN', men: 3, hp: 100, speed: 2.2, range: 44, damage: 14,  accuracy: 0.22, reload: 0.16, suppress: 2.5, gun: 'crank' },
  mortar:    { name: 'Mortar Team',        tag: 'MOR', men: 3, hp: 100, speed: 2.4, range: 70, damage: 80,  accuracy: 0.55, reload: 7,    suppress: 0, splash: 4.5, gun: 'mortar' },
  cannon:    { name: 'Field Gun',          tag: 'CAN', men: 4, hp: 100, speed: 2.0, range: 85, damage: 120, accuracy: 0.75, reload: 9,    suppress: 0, splash: 3.5, gun: 'cannon' },
  cavalry:   { name: 'Iron Horse Cavalry', tag: 'CAV', men: 4, hp: 160, speed: 7.5, range: 2.8, damage: 32, accuracy: 0.6,  reload: 1.8,  suppress: 8, aura: 16 },
  commander: { name: 'Command Staff',      tag: 'CMD', men: 3, hp: 110, speed: 3.4, range: 18, damage: 22,  accuracy: 0.45, reload: 3,    suppress: 3, aura: 22 },
};
const DEFAULT_WORLD = { repairRate: 1.2, rampRate: 1.6, maxSlope: 0.9, craterScale: 1, craterDepth: 1.3, baseRadius: 14, baseMinDamage: 0.15 };
const TYPE_ORDER = ['rifle', 'sapper', 'crank', 'mortar', 'cannon', 'cavalry', 'commander'];
const UNIT_FIELDS = [
  ['men', 'Men per squad (new squads)', 1, 9, 1], ['hp', 'Health per man (new squads)', 20, 400, 5],
  ['speed', 'Speed, m/s', 0.5, 12, 0.1], ['range', 'Range, m', 2, 120, 1], ['damage', 'Damage per hit', 1, 250, 1],
  ['accuracy', 'Accuracy', 0.02, 1, 0.01], ['reload', 'Reload, seconds', 0.05, 15, 0.05], ['suppress', 'Morale hit per shot', 0, 20, 0.5],
];
const EXTRA_FIELDS = { splash: ['splash', 'Blast radius, m', 1, 12, 0.5], aura: ['aura', 'Aura radius, m', 0, 50, 1] };
const WORLD_FIELDS = [
  ['repairRate', 'Crater repair, m³ per sapper per second', 0.1, 6, 0.1],
  ['rampRate', 'Ramp building, m³ per sapper per second', 0.1, 6, 0.1],
  ['maxSlope', 'Steepest walkable slope (rise per run)', 0.3, 2, 0.05],
  ['craterScale', 'Crater width', 0.2, 3, 0.05],
  ['craterDepth', 'Crater depth, m', 0.2, 4, 0.1],
  ['baseRadius', 'Base protection radius, m', 0, 40, 1],
  ['baseMinDamage', 'Terrain damage at base center (0 to 1)', 0, 1, 0.05],
];
const TYPES = JSON.parse(JSON.stringify(DEFAULT_TYPES));
const WORLD = Object.assign({}, DEFAULT_WORLD);
const STORE_KEY = 'plateauSandbox.tune.v1';
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved) {
    for (const t in saved.types || {}) if (TYPES[t]) Object.assign(TYPES[t], saved.types[t]);
    Object.assign(WORLD, saved.world || {});
  }
} catch (e) { /* storage unavailable */ }
function saveTune() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ types: TYPES, world: WORLD })); } catch (e) { /* ignore */ } }

const TEAM = {
  blue: { name: 'Meridian', css: '#5b8cf0', coat: 0x22335e, trou: 0x6c8fc6, cap: 0x22335e },
  grey: { name: 'Grey Coats', css: '#cfc6b6', coat: 0x8f8b82, trou: 0x6e6455, cap: 0x8a8379 },
};
const ENEMY = { blue: 'grey', grey: 'blue' };

// =============================================================== terrain
const SIZE = 160, N = 129, CELL = SIZE / (N - 1), HALF = SIZE / 2, BED = -3;
const H = new Float32Array(N * N), H0 = new Float32Array(N * N);
const I = (i, j) => j * N + i;
const gx = x => (x + HALF) / CELL;
const wx = i => i * CELL - HALF;
function hAt(x, z) {
  const fx = clamp(gx(x), 0, N - 1.0001), fz = clamp(gx(z), 0, N - 1.0001);
  const i = fx | 0, j = fz | 0, u = fx - i, v = fz - j;
  return lerp(lerp(H[I(i, j)], H[I(i + 1, j)], u), lerp(H[I(i, j + 1)], H[I(i + 1, j + 1)], u), v);
}
function segProj(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, L2 = dx * dx + dz * dz || 1;
  const t = ((px - ax) * dx + (pz - az) * dz) / L2;
  const cx = ax + dx * clamp(t, 0, 1), cz = az + dz * clamp(t, 0, 1);
  return { t, d: Math.hypot(px - cx, pz - cz) };
}
const BASES = { blue: { x: 0, z: -64 }, grey: { x: 0, z: 64 } };
const PLATEAUS = [
  { x: -40, z: 6, r: 15, h: 11, ramp: [-40, -34, -40, -11] },
  { x: 40, z: -6, r: 15, h: 11 },
];
const MOUNDS = [[0, 0, 7, 2.2], [-14, -26, 5, 1.4], [16, 24, 5, 1.4], [-62, -40, 8, 2], [62, 40, 8, 2], [24, -34, 4, 1.2], [-22, 32, 4, 1.2]];
function genTerrain() {
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = wx(i), z = wx(j);
    let h = 0.7 * Math.sin(x * 0.06 + 0.4) * Math.cos(z * 0.05) + 0.45 * Math.sin(x * 0.13 + 1.3) * Math.sin(z * 0.09 + 0.2) + 0.35 * Math.cos(z * 0.12 + x * 0.04);
    for (const [mx, mz, mr, mh] of MOUNDS) { const d = Math.hypot(x - mx, z - mz); h += mh * Math.exp(-(d * d) / (mr * mr)); }
    for (const B of Object.values(BASES)) h = lerp(h, 0.2, smooth(20, 12, Math.hypot(x - B.x, z - B.z)));
    for (const P of PLATEAUS) {
      const d = Math.hypot(x - P.x, z - P.z);
      h = lerp(h, P.h + 0.25 * Math.sin(x * 0.5) * Math.cos(z * 0.4), smooth(P.r + 3.5, P.r, d));
      if (P.ramp) {
        const [ax, az, bx, bz] = P.ramp, s = segProj(x, z, ax, az, bx, bz);
        if (s.t >= -0.02 && s.t <= 1.1) h = Math.max(h, lerp(h, P.h * clamp(s.t, 0, 1), smooth(4.5, 2.5, s.d)));
      }
    }
    H[I(i, j)] = H0[I(i, j)] = h;
  }
}
genTerrain();

// =============================================================== three.js scene
const glCanvas = $('#gl'), hud = $('#hud'), hctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9b7bd);
scene.fog = new THREE.Fog(0xa9b7bd, 150, 380);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 900);
scene.add(new THREE.HemisphereLight(0xe2ecf2, 0x4b4232, 0.85));
const sun = new THREE.DirectionalLight(0xfff0d4, 0.85); sun.position.set(60, 120, 40); scene.add(sun);

const tGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(N * N * 3), tCol = new Float32Array(N * N * 3);
const tIdx = new Uint32Array((N - 1) * (N - 1) * 6);
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = I(i, j); tPos[k * 3] = wx(i); tPos[k * 3 + 1] = H[k]; tPos[k * 3 + 2] = wx(j); }
{ let p = 0; for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) { const a = I(i, j), b = I(i, j + 1), c = I(i + 1, j), d = I(i + 1, j + 1); tIdx[p++] = a; tIdx[p++] = b; tIdx[p++] = c; tIdx[p++] = c; tIdx[p++] = b; tIdx[p++] = d; } }
tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
tGeo.setIndex(new THREE.BufferAttribute(tIdx, 1));
const terrain = new THREE.Mesh(tGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
scene.add(terrain);
const skirt = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshLambertMaterial({ color: 0x6f6a55 }));
skirt.rotation.x = -Math.PI / 2; skirt.position.y = -3.4; scene.add(skirt);

function colorVertex(i, j) {
  const k = I(i, j), h = H[k];
  const hn = (Math.sin(i * 12.9898 + j * 78.233) * 43758.5453) % 1;
  const v = 0.04 * hn;
  let r = 0.36 + v, g = 0.45 + v, b = 0.22 + v * 0.5;
  if (H0[k] > 8) { r = 0.5 + v; g = 0.49 + v; b = 0.27; }
  const nb = (a, c) => Math.abs(H[I(clamp(a, 0, N - 1), clamp(c, 0, N - 1))] - h) / CELL;
  const sl = Math.max(nb(i + 1, j), nb(i - 1, j), nb(i, j + 1), nb(i, j - 1));
  const rk = smooth(1.0, 1.8, sl);
  r = lerp(r, 0.47, rk); g = lerp(g, 0.44, rk); b = lerp(b, 0.39, rk);
  const dug = clamp((H0[k] - h - 0.12) / 0.6, 0, 1);
  r = lerp(r, 0.34, dug); g = lerp(g, 0.25, dug); b = lerp(b, 0.16, dug);
  const fill = clamp((h - H0[k] - 0.12) / 0.5, 0, 1);
  r = lerp(r, 0.53, fill); g = lerp(g, 0.4, fill); b = lerp(b, 0.24, fill);
  const bed = smooth(BED + 0.6, BED + 0.05, h);
  r = lerp(r, 0.27, bed); g = lerp(g, 0.26, bed); b = lerp(b, 0.3, bed);
  tCol[k * 3] = r; tCol[k * 3 + 1] = g; tCol[k * 3 + 2] = b;
}
for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) colorVertex(i, j);
tGeo.computeVertexNormals();
tGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 140);

let dirty = null;
function markDirty(i0, j0, i1, j1) {
  if (!dirty) dirty = [i0, j0, i1, j1];
  else { dirty[0] = Math.min(dirty[0], i0); dirty[1] = Math.min(dirty[1], j0); dirty[2] = Math.max(dirty[2], i1); dirty[3] = Math.max(dirty[3], j1); }
}
function flushTerrain() {
  if (!dirty) return;
  const i0 = Math.max(0, dirty[0] - 1), j0 = Math.max(0, dirty[1] - 1), i1 = Math.min(N - 1, dirty[2] + 1), j1 = Math.min(N - 1, dirty[3] + 1);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) { tPos[I(i, j) * 3 + 1] = H[I(i, j)]; colorVertex(i, j); }
  tGeo.attributes.position.needsUpdate = true;
  tGeo.attributes.color.needsUpdate = true;
  tGeo.computeVertexNormals();
  dirty = null;
}
function forVerts(x, z, r, fn) {
  const i0 = Math.max(0, Math.floor(gx(x - r))), i1 = Math.min(N - 1, Math.ceil(gx(x + r)));
  const j0 = Math.max(0, Math.floor(gx(z - r))), j1 = Math.min(N - 1, Math.ceil(gx(z + r)));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const d = Math.hypot(wx(i) - x, wx(j) - z);
    if (d <= r) fn(I(i, j), d, i, j);
  }
  markDirty(i0, j0, i1, j1);
}
function baseProtect(x, z) {
  let m = 1;
  const R = WORLD.baseRadius;
  if (R <= 0) return 1;
  for (const B of Object.values(BASES)) m = Math.min(m, lerp(WORLD.baseMinDamage, 1, smooth(R, R * 2.2, dist(x, z, B.x, B.z))));
  return m;
}
function crater(x, z, radius, depthMul) {
  const r = radius * WORLD.craterScale, dep = WORLD.craterDepth * depthMul * baseProtect(x, z);
  if (dep <= 0.01) return;
  forVerts(x, z, r * 1.45, (k, d) => {
    if (d < r) H[k] = Math.max(BED, H[k] - dep * (1 - (d / r) * (d / r)));
    else H[k] += dep * 0.22 * (1 - (d - r) / (r * 0.45));
  });
}
function resetTerrain() { H.set(H0); markDirty(0, 0, N - 1, N - 1); }

// =============================================================== pathfinding
const NN = N * N;

// =============================================================== effects
const MAXT = 240;

scene.add(tracerLines);

function addTracer(a, b, color) { if (tracers.length < MAXT) tracers.push({ a, b, c: color, life: 0.09 }); }

  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);

}

const puffs = [];
function puff(tex, x, y, z, size, life, rise = 0.6, additive = false) {
  let p = puffs.find(q => !q.alive && q.tex === tex);
  if (!p) {
    if (puffs.length > 260) return;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending });
    p = { sprite: new THREE.Sprite(mat), tex };
    scene.add(p.sprite); puffs.push(p);
  }

  p.sprite.visible = true; p.sprite.position.set(x, y, z); p.sprite.scale.setScalar(size * 0.5);
}
function updateEffects(dt) {
  tracers = tracers.filter(t => (t.life -= dt) > 0);
  for (let n = 0; n < tracers.length; n++) {
    const t = tracers[n];
    trPos.set([t.a[0], t.a[1], t.a[2], t.b[0], t.b[1], t.b[2]], n * 6);
    trCol.set([t.c[0], t.c[1], t.c[2], t.c[0], t.c[1], t.c[2]], n * 6);
  }
  trGeo.setDrawRange(0, tracers.length * 2);
  trGeo.attributes.position.needsUpdate = true; trGeo.attributes.color.needsUpdate = true;
  for (const p of puffs) {
    if (!p.alive) continue;
    p.t += dt;
    const k = p.t / p.life;
    if (k >= 1) { p.alive = false; p.sprite.visible = false; continue; }
    p.sprite.position.y += p.rise * dt;
    p.sprite.scale.setScalar(p.size * (0.5 + k * 0.9));
    p.sprite.material.opacity = 1 - k;
  }
}

// =============================================================== combat helpers
function inCover(m) {
  let s = 0;
  for (let a = 0; a < 6; a++) s += hAt(m.x + Math.cos(a) * 2.6, m.z + Math.sin(a) * 2.6);
  return s / 6 - m.y > 0.6;
}
function suppress(sq, amt) {

  sq.morale = Math.max(0, sq.morale - amt * (sq.auraC ? 0.6 : 1));
  sq.supT = 0;
}
function kill(m, src) {

  stat(m.sq.team, m.sq.type).lost++;

  if (!sq.alive.length) {
    sq.dead = true; selected.delete(sq);
    if (sq.weapon) { sq.weapon.crew = null; sq.weapon.team = null; sq.weapon = null; }

}

function explode(x, z, S, src, craterR, depthMul) {

  for (const sq of squads) {
    if (sq.dead) continue;
    let near = 1e9;
    for (const m of sq.members) {
      if (!m.alive) continue;
      const d = dist(m.x, m.z, x, z);
      near = Math.min(near, d);
      if (d < S.splash) { damage(m, S.damage * Math.pow(1 - d / S.splash, 0.7), src); anyHit = true; }

const ptrs = new Map();
let pinch = null, boxSel = null, mouse = [0, 0];
glCanvas.addEventListener('contextmenu', e => e.preventDefault());
glCanvas.addEventListener('pointerdown', e => {
  glCanvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, type: e.pointerType, btn: e.button, moved: false });
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), ang: Math.atan2(b.y - a.y, b.x - a.x), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    for (const p of ptrs.values()) p.moved = true;
  }
});
glCanvas.addEventListener('pointermove', e => {
  mouse = [e.clientX, e.clientY];
  const p = ptrs.get(e.pointerId);

  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size >= 2 && pinch) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), ang = Math.atan2(b.y - a.y, b.x - a.x), cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;

  }
  if (!p.moved && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) > 7) p.moved = true;
  if (!p.moved) return;

    else if (p.btn === 1 || p.btn === 2) { if (e.altKey || p.btn === 1) { cam.yaw -= dx * 0.006; cam.pitch = clamp(cam.pitch + dy * 0.004, 0.45, 1.35); } else panBy(dx, dy); }
  } else panBy(dx, dy);
});
function endPtr(e) {

  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = ptrs.size ? pinch : null;
  if (boxSel && p.type === 'mouse' && p.btn === 0) {
    const r = glCanvas.getBoundingClientRect();
    const x0 = Math.min(boxSel[0], boxSel[2]) - r.left, x1 = Math.max(boxSel[0], boxSel[2]) - r.left, y0 = Math.min(boxSel[1], boxSel[3]) - r.top, y1 = Math.max(boxSel[1], boxSel[3]) - r.top;
    if (!e.shiftKey) selected.clear();
    let team = selTeam();
    for (const sq of squads) {
      if (sq.dead) continue;
      const [x, z] = sq.centroid(), s = toScreen(x, hAt(x, z) + 1, z);
      if (s && s[0] >= x0 && s[0] <= x1 && s[1] >= y0 && s[1] <= y1) { if (!team) team = sq.team; if (sq.team === team) selected.add(sq); }
    }

glCanvas.addEventListener('pointerup', endPtr);
glCanvas.addEventListener('pointercancel', endPtr);
glCanvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist *= Math.exp(e.deltaY * 0.0012); }, { passive: false });
const keys = new Set();
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select')) return;
  keys.add(e.key.toLowerCase());
  if (e.key === ' ') { e.preventDefault(); setSpeed(timeScale ? 0 : 1); }
  if (e.key === 'Escape') { if (toolMode) setTool(null); else select(null, false); }
  if (e.key.toLowerCase() === 'c') { const g = groundAt(mouse[0], mouse[1]); if (g) explode(g[0], g[1], { damage: 150, splash: 5 }, null, 4.5, 1.6); }

function keyPan(dt) {
  const s = 600 * dt;
  if (keys.has('w') || keys.has('arrowup')) panBy(0, s);
  if (keys.has('s') || keys.has('arrowdown')) panBy(0, -s);
  if (keys.has('d') || keys.has('arrowright')) panBy(-s, 0);

// =============================================================== HUD overlay
function drawHUD() {
  const w = hud.clientWidth, h = hud.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (hud.width !== Math.round(w * dpr) || hud.height !== Math.round(h * dpr)) { hud.width = Math.round(w * dpr); hud.height = Math.round(h * dpr); }
  const c = hctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, h);
  c.font = '600 12px "Barlow Condensed", "Arial Narrow", sans-serif';
  c.textBaseline = 'middle';
  const ring = (x, z, r, color, dash) => {
    c.beginPath(); let first = true;
    for (let a = 0; a <= 32; a++) { const t = a / 32 * Math.PI * 2, px = x + Math.cos(t) * r, pz = z + Math.sin(t) * r, s = toScreen(px, hAt(px, pz) + 0.2, pz); if (!s) { first = true; continue; } if (first) { c.moveTo(s[0], s[1]); first = false; } else c.lineTo(s[0], s[1]); }
    c.setLineDash(dash || []); c.strokeStyle = color; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]);
  };
  for (const t in BASES) { const B = BASES[t]; if (WORLD.baseRadius > 0) ring(B.x, B.z, WORLD.baseRadius, t === 'blue' ? 'rgba(91,140,240,0.55)' : 'rgba(207,198,182,0.55)', [6, 5]); }
  for (const sq of squads) {
    if (sq.dead || !sq.order) continue;
    const o = sq.order;
    if (o.k === 'repair') ring(o.x, o.z, o.r, 'rgba(211,170,82,0.9)', [4, 4]);
    if (o.k === 'ramp') {
      const L = Math.atan2(o.bx - o.ax, o.bz - o.az), rx = Math.cos(L) * o.width / 2, rz = -Math.sin(L) * o.width / 2;
      const pts = [[o.ax + rx, o.az + rz], [o.bx + rx, o.bz + rz], [o.bx - rx, o.bz - rz], [o.ax - rx, o.az - rz]].map(([x, z]) => toScreen(x, Math.max(hAt(x, z), lerp(o.hA, o.hB, segProj(x, z, o.ax, o.az, o.bx, o.bz).t)) + 0.2, z));
      if (pts.every(Boolean)) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(211,170,82,0.95)'; c.lineWidth = 1.5; c.stroke(); c.setLineDash([]); }
    }
  }
  if (toolMode === 'rampB' && rampA) { const s = toScreen(rampA[0], hAt(rampA[0], rampA[1]) + 0.3, rampA[1]); if (s) { c.fillStyle = '#d3aa52'; c.beginPath(); c.arc(s[0], s[1], 6, 0, 7); c.fill(); } }
  for (let n = marks.length - 1; n >= 0; n--) {
    const mk = marks[n]; mk.t += 1 / 60;
    if (mk.t > 0.8) { marks.splice(n, 1); continue; }
    const s = toScreen(mk.x, hAt(mk.x, mk.z) + 0.2, mk.z);
    if (s) { c.strokeStyle = mk.color; c.globalAlpha = 1 - mk.t / 0.8; c.lineWidth = 2; c.beginPath(); c.arc(s[0], s[1], 6 + mk.t * 22, 0, 7); c.stroke(); c.globalAlpha = 1; }
  }
  const placed = [];
  for (const g of guns) {
    if (g.crew) continue;
    const s = toScreen(g.x, hAt(g.x, g.z) + 2.4, g.z);
    if (!s) continue;
    while (placed.some(q => Math.abs(q[0] - s[0]) < 150 && Math.abs(q[1] - s[1]) < 20)) s[1] -= 21;
    placed.push(s);
    const txt = 'Abandoned ' + TYPES[g.kind].name.toLowerCase() + ': walk a squad up to it';
    const tw = c.measureText(txt).width + 12;
    c.fillStyle = 'rgba(17,20,26,0.85)'; c.fillRect(s[0] - tw / 2, s[1] - 9, tw, 18);
    c.strokeStyle = '#d3aa52'; c.setLineDash([3, 3]); c.strokeRect(s[0] - tw / 2, s[1] - 9, tw, 18); c.setLineDash([]);
    c.fillStyle = '#ece4d2'; c.textAlign = 'center'; c.fillText(txt, s[0], s[1] + 1);
  }
  for (const sq of squads) {
    if (sq.dead) continue;
    const [x, z] = sq.centroid(), s = toScreen(x, hAt(x, z) + (sq.type === 'cavalry' ? 4 : 3.1), z);
    if (!s) continue;
    const al = sq.alive.length, sel = selected.has(sq);
    const tag = sq.weapon ? TYPES[sq.weapon.kind].tag : sq.S.tag;
    const label = `${tag} ${al}`;
    const bw = 46, bh = 17, bx = s[0] - bw / 2, by = s[1] - bh;
    c.fillStyle = sel ? 'rgba(40,33,18,0.95)' : 'rgba(17,20,26,0.78)';
    c.fillRect(bx, by, bw, bh);
    c.fillStyle = TEAM[sq.team].css; c.fillRect(bx, by, 4, bh);
    c.strokeStyle = sel ? '#d3aa52' : 'rgba(255,255,255,0.12)'; c.lineWidth = sel ? 1.5 : 1; c.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    c.fillStyle = '#ece4d2'; c.textAlign = 'left'; c.fillText(label, bx + 8, by + bh / 2 + 1);
    if (sq.auraC || sq.auraK) { c.fillStyle = '#d3aa52'; c.fillText('★', bx + bw - 11, by + bh / 2 + 1); }
    const mor = sq.morale / 100;
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(bx, by + bh, bw, 4);
    c.fillStyle = sq.pinned ? '#d4574a' : mor < 0.55 ? '#e0a040' : '#7fb069'; c.fillRect(bx, by + bh, bw * mor, 4);
    if (sq.pinned) { c.fillStyle = '#d4574a'; c.textAlign = 'center'; c.fillText('PINNED', s[0], by - 7); }
  }
  if (boxSel) {
    const r = glCanvas.getBoundingClientRect();
    c.strokeStyle = '#d3aa52'; c.lineWidth = 1; c.fillStyle = 'rgba(211,170,82,0.12)';
    const x = Math.min(boxSel[0], boxSel[2]) - r.left, y = Math.min(boxSel[1], boxSel[3]) - r.top, bw = Math.abs(boxSel[2] - boxSel[0]), bh = Math.abs(boxSel[3] - boxSel[1]);
    c.fillRect(x, y, bw, bh); c.strokeRect(x + 0.5, y + 0.5, bw, bh);
  }
}

  }
}
function renderReport() {
  const tbl = $('#repTable');
  if (!tbl) return;
  const rows = Object.values(stats).sort((a, b) => a.team.localeCompare(b.team) || TYPE_ORDER.indexOf(a.type) - TYPE_ORDER.indexOf(b.type));
  let html = '<thead><tr><th>Squad</th><th class="n">Alive</th><th class="n">Lost</th><th class="n">Kills</th><th class="n">Hit %</th></tr></thead><tbody>';
  for (const s of rows) {
    const alive = squads.filter(q => !q.dead && q.team === s.team && q.type === s.type).reduce((a, q) => a + q.alive.length, 0);
    const hit = s.shots ? Math.round(s.hits / s.shots * 100) + '%' : '–';
    html += `<tr><td><span class="dot" style="background:${TEAM[s.team].css}"></span>${TYPES[s.type].name}</td><td class="n">${alive}</td><td class="n">${s.lost}</td><td class="n">${s.kills}</td><td class="n">${hit}</td></tr>`;
  }
  tbl.innerHTML = html + '</tbody>';
}

// =============================================================== loop
function syncMeshes(dt) {
  for (const sq of squads) {
    const sel = selected.has(sq);
    for (const m of sq.members) {
      const g = m.mesh;
      if (m.alive) {
        const bob = sq.order && (sq.order.k === 'repair' || sq.order.k === 'ramp') && !m.moving && sq.order.started !== false ? Math.abs(Math.sin(simTime * 7 + m.k)) * 0.12 : 0;
        g.position.set(m.x, m.y + bob, m.z);
        g.rotation.set(0, m.heading, 0);
        g.userData.ring.visible = sel;
      } else {
        m.deadT += dt;
        g.rotation.x = -Math.min(1, m.deadT * 3) * Math.PI / 2;
        g.position.y = m.y - Math.max(0, m.deadT - 10) * 0.2;
        if (m.deadT > 16 && g.parent) scene.remove(g);
      }
    }
  }
  for (const g of guns) { g.mesh.position.set(g.x, hAt(g.x, g.z), g.z); g.mesh.rotation.y = g.heading; }
}
function step(dt) {
  simTime += dt;
  updateAuras();
  for (const sq of squads) if (!sq.dead) updateSquad(sq, dt);
  updateProjectiles(dt);
  updateCaptures();
  aiT -= dt;
  if (aiT <= 0) { aiT = 1.2; runAI(); }
}
let last = performance.now(), uiT = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  keyPan(real);
  let acc = real * timeScale;
  while (acc > 0) { const d = Math.min(acc, 0.05); step(d); acc -= d; }
  syncMeshes(real * timeScale);
  updateEffects(real * Math.max(timeScale, 0.0001) || 0);
  flushTerrain();
  placeCamera();
  renderer.render(scene, camera);
  drawHUD();
  uiT -= real;
  if (uiT <= 0) { uiT = 0.4; if (selected.size) refreshCmd(); if (drawer === 'report') renderReport(); }
  requestAnimationFrame(frame);
}
function resize() {
  const w = glCanvas.clientWidth, h = glCanvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

scenario();
resize();
refreshCmd();
toast('Grey Coats are marching on you. Tap a soldier to take command.', 4000);
requestAnimationFrame(frame);
})();
</script>
